apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-core-deployment
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1  
  selector:
    matchLabels:
      app: {{ .Release.Name }}-core
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-core
    spec:
      # Room for the shutdown save of the server workspaces (bounded by
      # snapshotTimeout, read like core does: under 1 means its default 120)
      # after SIGTERM, plus the rest of the close.
      {{- $snapshotTimeout := .Values.brain.workspace.snapshotTimeout | int64 }}
      {{- if lt $snapshotTimeout 1 }}{{ $snapshotTimeout = 120 }}{{ end }}
      terminationGracePeriodSeconds: {{ add $snapshotTimeout 30 }}
      containers:
      - name: core
        image: "{{ .Values.image.repository }}:core-{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}       
    
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-configmap
        # Credentials (DISCORD_TOKEN, LLM_API_KEY, CONTENT_GUARD_API_KEY, BRAIN_LLM_API_KEY, ...);
        # the chart's own Secret unless existingSecret names one
        - secretRef:
            name: {{ .Values.existingSecret | default (printf "%s-secret" .Release.Name) }}
        {{- if eq (include "dcb.llmEngine" .) "strata" }}
        # Strata checks the key, so core's LLM_API_KEY is the real one from the
        # Strata secret (an explicit env entry beats the configmap's).
        env:
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "dcb.strataSecretName" . }}
              key: STRATA_API_KEY
        {{- end }}
        {{- if .Values.metrics.enabled }}
        ports:
        - name: metrics
          containerPort: {{ .Values.metrics.port }}
        {{- end }}
        resources:
          limits:
            cpu: {{ .Values.coreResources.limits.cpu }}
            memory: {{ .Values.coreResources.limits.memory }}
          requests:
            cpu: {{ .Values.coreResources.requests.cpu }}
            memory: {{ .Values.coreResources.requests.memory }}
        # The server workspaces are containers on the node's Docker daemon
        # (agents.sandbox DockerSandboxClient), reached through this socket.
        # Required: core exits at startup without it.
        # Security note: this gives the core pod control of the node's Docker.
        volumeMounts:
        - name: docker-socket
          mountPath: /var/run/docker.sock
      {{- if .Values.voice.enabled }}
      # Discord voice I/O for core (voicesidecar/). Same pod so the bridge
      # stays on localhost: it is bound to 127.0.0.1 and has no auth of its
      # own. A core restart drops every call either way.
      - name: voice
        image: "{{ .Values.voice.image }}:voice-{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-configmap
        env:
        - name: VOICE_BRIDGE_HOST
          value: "127.0.0.1"
        - name: LOG_LEVEL
          value: info
        # exec, not httpGet: the server is bound to 127.0.0.1, which the
        # kubelet (connecting to the pod IP) cannot reach.
        readinessProbe:
          exec:
            command: ["node", "-e", "fetch('http://127.0.0.1:{{ .Values.voice.bridgePort }}/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
          periodSeconds: 15
          timeoutSeconds: 5
        resources:
          limits:
            cpu: {{ .Values.voiceSidecarResources.limits.cpu }}
            memory: {{ .Values.voiceSidecarResources.limits.memory }}
          requests:
            cpu: {{ .Values.voiceSidecarResources.requests.cpu }}
            memory: {{ .Values.voiceSidecarResources.requests.memory }}
      {{- end }}
      volumes:
      - name: docker-socket
        hostPath:
          path: {{ .Values.brain.workspace.dockerSocketPath }}
          type: Socket