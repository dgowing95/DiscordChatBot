{{- if .Values.metrics.enabled }}
# ClusterIP service so the ServiceMonitor has a backing Service: without
# one the operator generates no scrape endpoints (the bot itself needs no
# inbound traffic — only the /metrics port is exposed).
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-core-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-core
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-core
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}