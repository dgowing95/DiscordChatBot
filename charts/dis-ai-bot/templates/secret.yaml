# Credentials, kept out of the ConfigMap. A ConfigMap is readable by anything
# with configmap-get in the namespace and shows up in plain text in
# `kubectl describe`, which is the wrong home for a bot token or an API key.
#
# The values keys are unchanged (discordToken, openaiApiKey, sandbox.apiKey,
# diffusion.promptRewrite.apiKey, llamacpp.hfToken), so an existing values.yaml
# keeps working as-is; only where they are rendered has moved. The optional ones
# are omitted entirely when empty so an unset key does not become an empty env
# var.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DISCORD_TOKEN: {{ .Values.discordToken | quote }}
  {{- if .Values.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.openaiApiKey | quote }}
  {{- end }}
  {{- if .Values.sandbox.apiKey }}
  SANDBOX_LLM_API_KEY: {{ .Values.sandbox.apiKey | quote }}
  {{- end }}
  {{- if .Values.diffusion.promptRewrite.apiKey }}
  IMAGE_PROMPT_LLM_API_KEY: {{ .Values.diffusion.promptRewrite.apiKey | quote }}
  {{- end }}
{{- if .Values.llamacpp.hfToken }}
---
# Separate secret: the llamacpp pod needs only this one, and mounting the core
# pod's bot token into it would be a needless widening.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llamacpp-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.llamacpp.hfToken | quote }}
{{- end }}
