{{- if not .Values.existingSecret }}
# Credentials, kept out of the ConfigMap. A ConfigMap is readable by anything
# with configmap-get in the namespace and shows up in plain text in
# `kubectl describe`, which is the wrong home for a bot token or an API key.
#
# From discordToken, llm.apiKey, persona.apiKey, contentGuard.apiKey, brain.apiKey,
# diffusion.promptRewrite.apiKey, diffusion.review.apiKey, research.apiKey and
# llamacpp.hfToken. The optional ones are omitted entirely when empty so an
# unset key does not become an empty env var.
#
# existingSecret (and llamacpp.existingSecret) swap either Secret for one you
# manage yourself (sealed-secrets, External Secrets Operator, ...): the chart
# then renders nothing here and the pods reference your Secret by name. Keys
# are the same env var names as below.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  DISCORD_TOKEN: {{ .Values.discordToken | quote }}
  {{- if and .Values.llm.apiKey (ne (include "dcb.llmEngine" .) "strata") }}
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  {{- end }}
  {{- if .Values.contentGuard.apiKey }}
  CONTENT_GUARD_API_KEY: {{ .Values.contentGuard.apiKey | quote }}
  {{- end }}
  {{- if .Values.persona.apiKey }}
  PERSONA_LLM_API_KEY: {{ .Values.persona.apiKey | quote }}
  {{- end }}
  {{- if .Values.brain.apiKey }}
  BRAIN_LLM_API_KEY: {{ .Values.brain.apiKey | quote }}
  {{- end }}
  {{- if .Values.subagents.apiKey }}
  SUBAGENT_LLM_API_KEY: {{ .Values.subagents.apiKey | quote }}
  {{- end }}
  {{- if .Values.diffusion.promptRewrite.apiKey }}
  IMAGE_PROMPT_LLM_API_KEY: {{ .Values.diffusion.promptRewrite.apiKey | quote }}
  {{- end }}
  {{- if .Values.diffusion.review.apiKey }}
  IMAGE_REVIEW_LLM_API_KEY: {{ .Values.diffusion.review.apiKey | quote }}
  {{- end }}
  {{- if .Values.research.apiKey }}
  RESEARCH_LLM_API_KEY: {{ .Values.research.apiKey | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.llamacpp.hfToken (not .Values.llamacpp.existingSecret) }}
---
# Separate secret: the llamacpp pod needs only this one, and mounting the core
# pod's bot token into it would be a needless widening.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-llamacpp-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.llamacpp.hfToken | quote }}
{{- end }}
{{- if and (eq (include "dcb.llmEngine" .) "strata") .Values.strata.apiKey (not .Values.strata.existingSecret) }}
---
# Strata's API key, its own Secret for the same reason: the Strata pod reads
# it as API_KEY and core as LLM_API_KEY (dcb.strataSecretName).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-strata-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  STRATA_API_KEY: {{ .Values.strata.apiKey | quote }}
{{- end }}
