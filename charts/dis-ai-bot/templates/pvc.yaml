apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "helm.fullname" . }}-pvc-redis
  labels:
    type: local
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-redis
  capacity:
    storage: {{ .Values.pvc.redisSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.pvc.hostPath }}/redis
---
# llama.cpp (ex-Ollama) volume: PV/PVC names and hostPath are INTENTIONALLY still
# "ollama" so the pre-existing PV keeps matching and the data on the node is
# preserved on upgrade (renaming would create a new empty volume). Rendered
# whatever llmEngine is, so switching to Strata and back neither deletes nor
# re-binds it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "helm.fullname" . }}-pvc-ollama
  labels:
    type: local
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-ollama
  capacity:
    storage: {{ .Values.pvc.llamacppSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.pvc.hostPath }}/ollama
---
{{- if eq (include "dcb.llmEngine" .) "strata" }}
# Strata's /data (templates/strata.yaml). Must be on an SSD/NVMe: see
# strata.hostPath. Kept when switching back to llama.cpp (Helm's keep policy,
# ArgoCD's Prune=false): the files on the node survive either way, but a
# quick switch back would race the deleted PV's finalizer.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "helm.fullname" . }}-pvc-strata
  labels:
    type: local
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-strata
  capacity:
    storage: {{ .Values.pvc.strataSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.strata.hostPath | default (printf "%s/strata" .Values.pvc.hostPath) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: strata-pv-claim
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-strata
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.strataSize }}
---
{{- end }}
# Image generation model cache (HF_HOME). Only rendered when diffusion is
# enabled (templates/diffusion.yaml mounts the claim).
{{- if .Values.diffusion.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "helm.fullname" . }}-pvc-diffusers
  labels:
    type: local
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-diffusers
  capacity:
    storage: {{ .Values.pvc.diffusersSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.pvc.hostPath }}/diffusers
---
{{- end }}
# Speech models (Whisper + Kokoro). Only rendered when voice is enabled
# (templates/speech.yaml mounts the claim).
{{- if .Values.voice.enabled }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "helm.fullname" . }}-pvc-speech
  labels:
    type: local
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-speech
  capacity:
    storage: {{ .Values.pvc.speechSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ .Values.pvc.hostPath }}/speech
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: speech-pv-claim
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-speech
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.speechSize }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pv-claim
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-redis
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.redisSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pv-claim
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-ollama
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.llamacppSize }}
---
{{- if .Values.diffusion.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: diffusers-pv-claim
spec:
  storageClassName: {{ include "helm.fullname" . }}-pvc-diffusers
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.diffusersSize }}
{{- end }}
