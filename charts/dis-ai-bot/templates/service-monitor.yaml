{{- if .Values.metrics.enabled }}
# Prometheus scraping for kube-prometheus-stack (Prometheus Operator):
# selects the core pods by label and scrapes their named "metrics" port
# (see core.yaml). The custom metric prefix "discord_bot_" keeps the series
# namespaced; the process_* / python_* / go_* auto-exposed process metrics
# are scraped on the same endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    # Required by the cluster's Prometheus operator (iac-homelab), which
    # only imports ServiceMonitors labelled release: kube-prometheus-stack.
    release: kube-prometheus-stack
spec:
  serviceName: {{ .Release.Name }}-core-service
  selector:
    matchLabels:
      app: {{ .Release.Name }}-core
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.scrapeInterval }}
{{- end }}