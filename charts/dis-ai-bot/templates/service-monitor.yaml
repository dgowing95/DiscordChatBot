{{- if .Values.metrics.enabled }}
# Prometheus scraping for kube-prometheus-stack (Prometheus Operator):
# selects the core pods by label and scrapes their named "metrics" port
# (see core.yaml). The custom metric prefix "discord_bot_" keeps the series
# namespaced; the process_* / python_* / go_* auto-exposed process metrics
# are scraped on the same endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-core
  namespace: {{ .Release.Namespace }}
  labels:
    # Required by the cluster's Prometheus operator (iac-homelab), which
    # only imports ServiceMonitors labelled release: kube-prometheus-stack.
    release: kube-prometheus-stack
spec:
  # No serviceName here: the cluster's Prometheus operator runs a newer
  # ServiceMonitor CRD that has no such field (it is silently pruned by the
  # API server). Instead, `selector` matches Services by label — the
  # dchatbot-core-service (core-service.yaml) carries app: dchatbot-core.
  selector:
    matchLabels:
      app: {{ .Release.Name }}-core
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.scrapeInterval }}
{{- if eq (include "dcb.llmEngine" .) "llamacpp" }}
---
# llama.cpp's OWN metrics (llamacpp:* series), enabled by
# LLAMA_ARG_ENDPOINT_METRICS in llamacpp.yaml under this same switch. It answers
# what the discord_bot_* series cannot: llamacpp:n_tokens_max, the server's own
# high watermark of context size observed, plus requests_processing /
# requests_deferred and prompt/predict throughput.
#
# Scraped on the API port (8080, named "http") — llama.cpp has no separate
# metrics port. Same operator constraints as above: the release label is
# required, and there is no serviceName field on this CRD.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-llamacpp
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-llamacpp
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.scrapeInterval }}
{{- else }}
---
# Strata's own metrics (llmEngine: strata), on its API port like llama.cpp's.
# vLLM-style names (vllm:num_requests_running, vllm:prompt_tokens_total,
# vllm:prefix_cache_hits_total, latency histograms, ...) plus strata:*
# gauges (live tok/s, RAM and GPU use). /metrics needs the API key, so the
# scrape sends it from the Strata secret; Prometheus' default Accept header
# gets the text format. The operator reads that Secret from this namespace
# itself (it needs read access to Secrets here), so nothing has to be listed
# in the Prometheus object's spec.secrets.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-strata
  namespace: {{ .Release.Namespace }}
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-strata
  namespaceSelector:
    matchNames:
    - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.scrapeInterval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "dcb.strataSecretName" . }}
          key: STRATA_API_KEY
{{- end }}
{{- end }}