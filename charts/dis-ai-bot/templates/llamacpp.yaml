# llama.cpp server (replaces Ollama). Volume naming: see templates/pvc.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-llamacpp-deployment
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate    
  selector:
    matchLabels:
      app: {{ .Release.Name }}-llamacpp
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-llamacpp
    spec:
      runtimeClassName: nvidia
      volumes:
        - name: llamacpp-data
          # Intentionally the pre-existing claim: keeps old data mounted.
          persistentVolumeClaim:
            claimName: ollama-pv-claim
      containers:
      - name: llamacpp
        image: "{{ .Values.llamacpp.image }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: {{ .Values.llamacpp.port }}
        volumeMounts:
          - name: llamacpp-data
            mountPath: /models
        # LLAMA_CACHE = model cache on the preserved volume; other settings are
        # llama.cpp's LLAMA_ARG_* env vars (== CLI flags)
        env:
        - name: LLAMA_CACHE
          value: /models
        # See diffusion.yaml: empty = "all" (device plugin decides), or
        # CDI-qualified device names to pin this pod to specific physical cards.
        - name: NVIDIA_VISIBLE_DEVICES
          value: {{ .Values.llamacpp.visibleDevices | default "all" | quote }}
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: all
        {{- if .Values.llamacpp.modelPath }}
        # Local GGUF on the mounted volume instead of a Hugging Face download.
        # Mutually exclusive with LLAMA_ARG_HF_REPO (which would win and try to
        # download), so the two branches are an if/else, not both.
        - name: LLAMA_ARG_MODEL
          value: {{ .Values.llamacpp.modelPath | quote }}
        - name: LLAMA_ARG_ALIAS
          # Served name in /v1/models. Without it llama.cpp names the model
          # after the file, which would not match core's MODEL.
          value: "{{ .Values.model }}"
        {{- else }}
        - name: LLAMA_ARG_HF_REPO
          # == .Values.model: the one model value shared with core's MODEL
          value: "{{ .Values.model }}"
        {{- end }}
        {{- if .Values.llamacpp.hfToken }}
        - name: HF_TOKEN
          # read token for gated HF repos (llama.cpp reads HF_TOKEN when downloading)
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-llamacpp-secret
              key: HF_TOKEN
        {{- end }}
        - name: LLAMA_ARG_N_GPU_LAYERS
          value: {{ .Values.llamacpp.gpuLayers | quote }}
        - name: LLAMA_ARG_CACHE_TYPE_K
          value: {{ .Values.llamacpp.cacheTypeK | quote }}
        - name: LLAMA_ARG_CACHE_TYPE_V
          value: {{ .Values.llamacpp.cacheTypeV | quote }}
        - name: LLAMA_ARG_CTX_CHECKPOINTS
          value: {{ .Values.llamacpp.ctxCheckpoints | quote }}
        - name: LLAMA_ARG_CTX_SIZE
          value: {{ .Values.llamacppContextLength | quote }}
        - name: LLAMA_ARG_PORT
          value: {{ .Values.llamacpp.port | quote }}
        - name: LLAMA_ARG_N_PARALLEL
          value: {{ .Values.llamacpp.parallel | quote }}
        - name: LLAMA_ARG_LOG_VERBOSITY
          value: {{ .Values.llamacpp.verbosity | quote }}
        {{- if .Values.metrics.enabled }}
        # --metrics: serves llama.cpp's own Prometheus metrics on GET /metrics,
        # on the SAME port as the API (there is no separate metrics port). Off
        # by default upstream — without it the endpoint returns 501. The one
        # that answers "how much of LLAMA_ARG_CTX_SIZE do we actually use" is
        # llamacpp:n_tokens_max, the high watermark of context size observed;
        # it resets to 0 when this pod restarts, so query it with
        # max_over_time() and never rate(). See service-monitor.yaml.
        - name: LLAMA_ARG_ENDPOINT_METRICS
          value: "1"
        {{- end }}
        {{- range $name, $value := .Values.llamacpp.extraEnv }}
        # llamacpp.extraEnv — rendered last so a repeated name wins (the
        # kubelet takes the final occurrence).
        - name: {{ $name }}
          value: {{ $value | quote }}
        {{- end }}
        resources:
          limits:
            cpu: {{ .Values.llamacppResources.limits.cpu }}
            memory: {{ .Values.llamacppResources.limits.memory }}
            # Mutually exclusive with llamacpp.visibleDevices — see diffusion.yaml
            {{- if not .Values.llamacpp.visibleDevices }}
            nvidia.com/gpu: {{ .Values.llamacppResources.gpu }}
            {{- end }}
          requests:
            cpu: {{ .Values.llamacppResources.requests.cpu }}
            memory: {{ .Values.llamacppResources.requests.memory }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-llamacpp-service
  namespace: {{ .Release.Namespace }}
  labels:
    # Not decorative: the ServiceMonitor's selector matches SERVICE labels (not
    # pod labels), so without this it selects nothing and Prometheus silently
    # shows no llamacpp target. Same pairing as core-service.yaml.
    app: {{ .Release.Name }}-llamacpp
spec:
  type: NodePort
  selector:
    app: {{ .Release.Name }}-llamacpp
  ports:
    - port: {{ .Values.llamacpp.port }}
      targetPort: {{ .Values.llamacpp.port }}
      # Kept stable from the ollama service so existing external clients keep working
      nodePort: 31434
      protocol: TCP
      name: http
