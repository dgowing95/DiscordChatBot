{{- include "dcb.failOnRemoved" . }}
{{- include "dcb.checkStrataKeys" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configmap
  namespace: {{ .Release.Namespace }}
data:
  # Credentials are NOT here - see secret.yaml (same values.yaml keys).
  REDIS_HOST: {{ .Values.redisHost | toString | quote }}
  # llm.host, else the selected engine's in-cluster service (see _helpers.tpl).
  # The key is in secret.yaml (llm.apiKey), or the Strata secret (core.yaml).
  LLM_HOST: {{ include "dcb.llmHost" . }}
  LLM_MODEL: {{ .Values.llm.model | quote }}
  # Slots: used only when the server's /props does not report them.
  LLM_SLOTS: {{ include "dcb.llmSlots" . | quote }}
  LLM_CHAT_RESERVED: {{ .Values.llm.chatReserved | toString | quote }}
  # The persona's LLM: empty model/host fall back to the bot's own (LLM_*);
  # its key lives in secret.yaml.
  {{- if .Values.persona.model }}
  PERSONA_MODEL: {{ .Values.persona.model | quote }}
  {{- end }}
  {{- if .Values.persona.llmHost }}
  PERSONA_LLM_HOST: {{ .Values.persona.llmHost | quote }}
  {{- end }}
  PERSONA_REASONING_EFFORT: {{ .Values.persona.reasoningEffort | quote }}
  PERSONA_MAX_TURNS: {{ .Values.persona.maxTurns | toString | quote }}
  PERSONA_CALL_TIMEOUT_SECONDS: {{ .Values.persona.callTimeout | toString | quote }}
  MSG_HISTORY_LIMIT: {{ .Values.history.limit | toString | quote }}
  MSG_HISTORY_MODE: {{ .Values.history.mode | quote }}
  MSG_HISTORY_REFRESH_MESSAGES: {{ .Values.history.refreshMessages | toString | quote }}
  MSG_HISTORY_RESERVE_TOKENS: {{ .Values.history.reserveTokens | toString | quote }}
  SHOW_THINKING: {{ .Values.showThinking | quote }}
  WHATS_NEW_ENABLED: {{ .Values.whatsNew.enabled | quote }}
  DOUBLE_REPLY_CHANCE: {{ .Values.doubleReply.chance | toString | quote }}
  DOUBLE_REPLY_COOLDOWN_REPLIES: {{ .Values.doubleReply.cooldownReplies | toString | quote }}
  # Queue concurrency: worker task count + bounded queue size (see core/main.py)
  QUEUE_WORKERS: {{ .Values.queue.workers | toString | quote }}
  QUEUE_MAX_SIZE: {{ .Values.queue.maxSize | toString | quote }}
  AUTOMATIONS_ENABLED: {{ .Values.automations.enabled | quote }}
  AUTOMATIONS_TIMEZONE: {{ .Values.automations.timezone | quote }}
  SCHEDULE_MIN_INTERVAL_HOURS: {{ .Values.schedules.minIntervalHours | toString | quote }}
  SCHEDULE_MAX_PER_GUILD: {{ .Values.schedules.maxPerGuild | toString | quote }}
  RULE_MAX_PER_GUILD: {{ .Values.rules.maxPerGuild | toString | quote }}
  RULE_COOLDOWN_SECONDS: {{ .Values.rules.cooldownSeconds | toString | quote }}
  FOLLOWUP_MAX_PER_GUILD: {{ .Values.followups.maxPerGuild | toString | quote }}
  EVENTS_ENABLED: {{ .Values.events.enabled | quote }}
  # Voice calls: core, the voice sidecar (same pod) and the speech pod all
  # read these
  VOICE_ENABLED: {{ .Values.voice.enabled | quote }}
  {{- if .Values.voice.enabled }}
  VOICE_BRIDGE_URL: {{ printf "ws://127.0.0.1:%v" .Values.voice.bridgePort | quote }}
  VOICE_BRIDGE_PORT: {{ .Values.voice.bridgePort | toString | quote }}
  SPEECH_URL: {{ if .Values.voice.speechUrl }}{{ .Values.voice.speechUrl }}{{ else }}http://{{ .Release.Name }}-speech-service.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.voice.speechPort }}{{ end }}
  VOICE_IDLE_LEAVE_SECONDS: {{ .Values.voice.idleLeaveSeconds | toString | quote }}
  VOICE_HISTORY_LIMIT: {{ .Values.voice.historyLimit | toString | quote }}
  VOICE_HISTORY_REFRESH: {{ .Values.voice.historyRefresh | toString | quote }}
  VOICE_FOLLOWUP_SECONDS: {{ .Values.voice.followupSeconds | toString | quote }}
  VOICE_THINKING: {{ .Values.voice.thinking | quote }}
  VOICE_DEFAULT_VOICE: {{ .Values.voice.defaultVoice | quote }}
  VOICE_SILENCE_MS: {{ .Values.voice.silenceMs | toString | quote }}
  VOICE_PREFILL_MIN_SECONDS: {{ .Values.voice.prefillMinSeconds | toString | quote }}
  STT_MODEL: {{ .Values.voice.sttModel | quote }}
  STT_THREADS: {{ .Values.voice.sttThreads | toString | quote }}
  STT_CONCURRENCY: {{ .Values.voice.sttConcurrency | toString | quote }}
  TTS_THREADS: {{ .Values.voice.ttsThreads | toString | quote }}
  TTS_CONCURRENCY: {{ .Values.voice.ttsConcurrency | toString | quote }}
  SPEECH_QUEUE_SIZE: {{ .Values.voice.queueSize | toString | quote }}
  {{- end }}
  # Reading links (fetch_url, in core). BROWSER_URL is the browser service:
  # browser.url, else the in-cluster one when browser.enabled, else none (no
  # fallback). The browser pod and core both read BROWSER_TIMEOUT/SETTLE.
  WEB_FETCH_PART_CHARS: {{ .Values.webFetch.partChars | int64 | toString | quote }}
  WEB_FETCH_MAX_CHARS: {{ .Values.webFetch.maxChars | int64 | toString | quote }}
  WEB_FETCH_MAX_BYTES: {{ .Values.webFetch.maxBytes | int64 | toString | quote }}
  WEB_FETCH_TIMEOUT: {{ .Values.webFetch.timeout | int64 | toString | quote }}
  WEB_CACHE_TTL_SECONDS: {{ .Values.webFetch.cacheTtlSeconds | int64 | toString | quote }}
  WEB_CACHE_VIDEO_TTL_SECONDS: {{ .Values.webFetch.videoCacheTtlSeconds | int64 | toString | quote }}
  WEB_CACHE_FAILURE_TTL_SECONDS: {{ .Values.webFetch.failureCacheTtlSeconds | int64 | toString | quote }}
  BROWSER_MIN_CHARS: {{ .Values.webFetch.browserMinChars | int64 | toString | quote }}
  # web_search's brief: a CORE-side LLM call. Unset model/host fall back to
  # the bot's own LLM_MODEL/LLM_HOST; the key lives in secret.yaml.
  RESEARCH_BRIEF_ENABLED: {{ .Values.research.enabled | quote }}
  RESEARCH_PAGES: {{ .Values.research.pages | toString | quote }}
  RESEARCH_PAGE_CHARS: {{ .Values.research.pageChars | int64 | toString | quote }}
  RESEARCH_FETCH_TIMEOUT: {{ .Values.research.fetchTimeout | toString | quote }}
  RESEARCH_TIMEOUT: {{ .Values.research.timeout | toString | quote }}
  {{- if .Values.research.model }}
  RESEARCH_MODEL: {{ .Values.research.model }}
  {{- end }}
  {{- if .Values.research.llmHost }}
  RESEARCH_LLM_HOST: {{ .Values.research.llmHost }}
  {{- end }}
  BROWSER_URL: {{ if .Values.browser.url }}{{ .Values.browser.url | quote }}{{ else if .Values.browser.enabled }}{{ printf "http://%s-browser-service.%s.svc.cluster.local:%v" .Release.Name .Release.Namespace .Values.browser.port | quote }}{{ else }}""{{ end }}
  BROWSER_CONCURRENCY: {{ .Values.browser.concurrency | toString | quote }}
  BROWSER_QUEUE_SIZE: {{ .Values.browser.queueSize | toString | quote }}
  BROWSER_TIMEOUT: {{ .Values.browser.timeout | toString | quote }}
  BROWSER_SETTLE_SECONDS: {{ .Values.browser.settleSeconds | toString | quote }}
  # Image generation (diffusion): core only registers the generate_image tool
  # when IMAGE_GEN_ENABLED is true; the diffusion pod reads the IMAGE_* settings
  DIFFUSION_URL: {{ if .Values.diffusion.url }}{{ .Values.diffusion.url }}{{ else }}http://{{ .Release.Name }}-diffusion-service.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.diffusion.port }}{{ end }}
  IMAGE_GEN_ENABLED: {{ .Values.diffusion.enabled | quote }}
  IMAGE_MODEL: {{ .Values.diffusion.model }}
  IMAGE_STEPS: {{ .Values.diffusion.steps | toString | quote }}
  IMAGE_WIDTH: {{ .Values.diffusion.width | toString | quote }}
  IMAGE_HEIGHT: {{ .Values.diffusion.height | toString | quote }}
  IMAGE_OFFLOAD: {{ .Values.diffusion.offload }}
  IMAGE_QUANTIZE: {{ .Values.diffusion.quantize | default "none" | quote }}
  IMAGE_QUEUE_SIZE: {{ .Values.diffusion.queueSize | toString | quote }}
  IMAGE_LONG_PROMPT: {{ .Values.diffusion.longPrompt | quote }}
  IMAGE_NEGATIVE_PROMPT: {{ .Values.diffusion.negativePrompt | quote }}
  {{- if .Values.diffusion.guidance }}
  IMAGE_GUIDANCE: {{ .Values.diffusion.guidance | toString | quote }}
  {{- end }}
  {{- if .Values.diffusion.seed }}
  IMAGE_SEED: {{ .Values.diffusion.seed | toString | quote }}
  {{- end }}
  # Prompt rewriter: a CORE-side LLM call (not the diffusion pod) that turns a
  # request into an SDXL prompt + negative prompt. Unset model/host fall back
  # to the bot's own LLM_MODEL/LLM_HOST; the key lives in secret.yaml.
  IMAGE_PROMPT_REWRITE_ENABLED: {{ .Values.diffusion.promptRewrite.enabled | quote }}
  IMAGE_PROMPT_TIMEOUT: {{ .Values.diffusion.promptRewrite.timeout | toString | quote }}
  {{- if .Values.diffusion.promptRewrite.model }}
  IMAGE_PROMPT_MODEL: {{ .Values.diffusion.promptRewrite.model }}
  {{- end }}
  {{- if .Values.diffusion.promptRewrite.llmHost }}
  IMAGE_PROMPT_LLM_HOST: {{ .Values.diffusion.promptRewrite.llmHost }}
  {{- end }}
  # Image check: a CORE-side vision call on each generated image before it is
  # posted (what it shows; what is missing, which earns a retry). Unset
  # model/host fall back to the bot's own; the key lives in secret.yaml.
  IMAGE_REVIEW_ENABLED: {{ .Values.diffusion.review.enabled | quote }}
  IMAGE_REVIEW_RETRIES: {{ .Values.diffusion.review.retries | toString | quote }}
  IMAGE_REVIEW_TIMEOUT: {{ .Values.diffusion.review.timeout | toString | quote }}
  {{- if .Values.diffusion.review.model }}
  IMAGE_REVIEW_MODEL: {{ .Values.diffusion.review.model }}
  {{- end }}
  {{- if .Values.diffusion.review.llmHost }}
  IMAGE_REVIEW_LLM_HOST: {{ .Values.diffusion.review.llmHost }}
  {{- end }}
  # Tier 3 workflows and their helpers (subagents). Empty subagent
  # model/host fall back to the brain's; the key lives in secret.yaml.
  WORKFLOW_ENABLED: {{ .Values.workflows.enabled | quote }}
  WORKFLOW_FROM_AUTOMATIONS: {{ .Values.workflows.fromAutomations | quote }}
  WORKFLOW_ASK_TIMEOUT: {{ .Values.workflows.askTimeout | toString | quote }}
  WORKFLOW_PLAN_APPROVAL_SECONDS: {{ .Values.workflows.planApprovalSeconds | toString | quote }}
  WORKFLOW_PLAN_REVISIONS: {{ .Values.workflows.planRevisions | toString | quote }}
  WORKFLOW_MAX_STEPS: {{ .Values.workflows.maxSteps | toString | quote }}
  WORKFLOW_TIMEOUT: {{ .Values.workflows.timeout | toString | quote }}
  WORKFLOW_MAX_TURNS: {{ .Values.workflows.maxTurns | toString | quote }}
  WORKFLOW_MAX_TOKENS: {{ .Values.workflows.maxTokens | int64 | toString | quote }}
  WORKFLOW_MAX_PER_GUILD: {{ .Values.workflows.maxPerGuild | toString | quote }}
  {{- if .Values.subagents.model }}
  SUBAGENT_MODEL: {{ .Values.subagents.model | quote }}
  {{- end }}
  {{- if .Values.subagents.llmHost }}
  SUBAGENT_LLM_HOST: {{ .Values.subagents.llmHost | quote }}
  {{- end }}
  {{- if .Values.subagents.reasoningEffort }}
  SUBAGENT_REASONING_EFFORT: {{ .Values.subagents.reasoningEffort | quote }}
  {{- end }}
  {{- if .Values.subagents.callTimeout }}
  SUBAGENT_CALL_TIMEOUT_SECONDS: {{ .Values.subagents.callTimeout | toString | quote }}
  {{- end }}
  SUBAGENT_MAX_TURNS: {{ .Values.subagents.maxTurns | toString | quote }}
  SUBAGENT_MAX_CONCURRENT: {{ .Values.subagents.maxConcurrent | toString | quote }}
  # The server workspace container runs on the node's Docker daemon, through
  # the socket mounted in core.yaml.
  {{- with .Values.brain.workspace }}
  WORKSPACE_IMAGE: {{ .image | quote }}
  # Namespace + release name: the reaper only removes containers with its own
  # label, so two same-named releases in different namespaces must not share it.
  WORKSPACE_INSTANCE: {{ printf "%s-%s" $.Release.Namespace $.Release.Name | quote }}
  WORKSPACE_IDLE_SECONDS: {{ .idleSeconds | int64 | toString | quote }}
  WORKSPACE_SNAPSHOT_INTERVAL_SECONDS: {{ .snapshotIntervalSeconds | int64 | toString | quote }}
  WORKSPACE_MAX_WARM: {{ .maxWarm | int64 | toString | quote }}
  WORKSPACE_JOB_RETENTION_HOURS: {{ .jobRetentionHours | int64 | toString | quote }}
  WORKSPACE_PIDS_LIMIT: {{ .pidsLimit | int64 | toString | quote }}
  WORKSPACE_SNAPSHOT_MAX_BYTES: {{ .snapshotMaxBytes | int64 | toString | quote }}
  WORKSPACE_SNAPSHOT_TTL_SECONDS: {{ .snapshotTtlSeconds | int64 | toString | quote }}
  WORKSPACE_SNAPSHOT_TIMEOUT_SECONDS: {{ .snapshotTimeout | int64 | toString | quote }}
  WORKSPACE_INPUT_MAX_BYTES: {{ .inputMaxBytes | int64 | toString | quote }}
  WORKSPACE_PREWARM: {{ .prewarm | toString | quote }}
  {{- /* Compared as text, not with `with`: a numeric 0 would be skipped as
       empty, and core reads 0 as no cap, so it is refused like a typo */}}
  {{- $cpu := toString .cpuLimit }}
  {{- if not (has $cpu (list "" "<nil>")) }}
  {{- if or (not (regexMatch "^[0-9]+([.][0-9]+)?$" $cpu)) (regexMatch "^[0.]+$" $cpu) }}
  {{- fail (printf "brain.workspace.cpuLimit must be a number of CPUs greater than 0, like 2 or 0.5, not %q" $cpu) }}
  {{- end }}
  WORKSPACE_CPU_LIMIT: {{ $cpu | quote }}
  {{- end }}
  {{- with .memoryLimit }}
  {{- /* Refused here: core would otherwise run every workspace uncapped over a typo */}}
  {{- if or (not (regexMatch "^[0-9]+([.][0-9]+)?([bkmgBKMG][bB]?)?$" (toString .))) (regexMatch "^[0.]+[a-zA-Z]*$" (toString .)) }}
  {{- fail (printf "brain.workspace.memoryLimit must be a size like 4g, 4gb or 512m, not %q" (toString .)) }}
  {{- end }}
  WORKSPACE_MEMORY_LIMIT: {{ . | toString | quote }}
  {{- end }}
  {{- end }}
  # The brain's LLM: empty model/host fall back to the bot's own (LLM_*); its
  # key lives in secret.yaml.
  {{- if .Values.brain.model }}
  BRAIN_MODEL: {{ .Values.brain.model | quote }}
  {{- end }}
  {{- if .Values.brain.llmHost }}
  BRAIN_LLM_HOST: {{ .Values.brain.llmHost | quote }}
  {{- end }}
  BRAIN_REASONING_EFFORT: {{ .Values.brain.reasoningEffort | quote }}
  BRAIN_CALL_TIMEOUT_SECONDS: {{ .Values.brain.callTimeout | toString | quote }}
  BRAIN_MAX_TURNS: {{ .Values.brain.maxTurns | toString | quote }}
  BRAIN_TIMEOUT: {{ .Values.brain.timeout | toString | quote }}
  BRAIN_REPEAT_LIMIT: {{ .Values.brain.repeatLimit | toString | quote }}
  BRAIN_TRIM_KEEP_RECENT: {{ .Values.brain.trimKeepRecent | toString | quote }}
  BRAIN_UNPROMPTED_MAX_TURNS: {{ .Values.brain.unprompted.maxTurns | toString | quote }}
  BRAIN_UNPROMPTED_TIMEOUT: {{ .Values.brain.unprompted.timeout | toString | quote }}
  BRAIN_ASK_TIMEOUT: {{ .Values.brain.askTimeout | toString | quote }}
  BRAIN_MAX_CONCURRENT: {{ .Values.brain.maxConcurrent | toString | quote }}
  BRAIN_QUEUE_WAIT: {{ .Values.brain.queueWait | toString | quote }}
  SKILLS_ENABLED: {{ .Values.skills.enabled | quote }}
  SKILLS_MAX_PER_GUILD: {{ .Values.skills.maxPerGuild | toString | quote }}
  SKILLS_MAX_VERSIONS: {{ .Values.skills.maxVersions | toString | quote }}
  SKILLS_MAX_BYTES: {{ .Values.skills.maxBytes | toString | quote }}
  SKILLS_MAX_BODY_CHARS: {{ .Values.skills.maxBodyChars | toString | quote }}
  SKILLS_MAX_FILES: {{ .Values.skills.maxFiles | toString | quote }}
  SKILLS_INDEX_MAX: {{ .Values.skills.indexMax | toString | quote }}
  SKILLS_REFLECTION_ENABLED: {{ .Values.skills.reflection.enabled | quote }}
  SKILLS_REFLECTION_MIN_TOOL_CALLS: {{ .Values.skills.reflection.minToolCalls | toString | quote }}
  SKILLS_CURATOR_ENABLED: {{ .Values.skills.curator.enabled | quote }}
  SKILLS_CURATOR_INTERVAL_HOURS: {{ .Values.skills.curator.intervalHours | toString | quote }}
  SKILLS_CURATOR_MIN_SKILLS: {{ .Values.skills.curator.minSkills | toString | quote }}
  SKILLS_RETIRE_DAYS: {{ .Values.skills.curator.retireDays | toString | quote }}
  # Content guard (moderation of web and sandbox input); the key lives in
  # secret.yaml.
  CONTENT_GUARD_ENABLED: {{ .Values.contentGuard.enabled | quote }}
  {{- if .Values.contentGuard.baseUrl }}
  CONTENT_GUARD_BASE_URL: {{ .Values.contentGuard.baseUrl | quote }}
  {{- end }}
  {{- if .Values.contentGuard.model }}
  CONTENT_GUARD_MODEL: {{ .Values.contentGuard.model | quote }}
  {{- end }}
  CONTENT_GUARD_MAX_RETRIES: {{ .Values.contentGuard.maxRetries | toString | quote }}
  CONTENT_GUARD_RETRY_BACKOFF: {{ .Values.contentGuard.retryBackoff | toString | quote }}
  CONTENT_GUARD_CACHE_TTL_SECONDS: {{ .Values.contentGuard.cacheTtlSeconds | toString | quote }}
  CONTENT_GUARD_DEBUG: {{ .Values.contentGuard.debug | quote }}
  # Prometheus metrics: core serves /metrics on METRICS_PORT; empty disables
  # the metrics server (helm: metrics.enabled)
  METRICS_PORT: {{ if .Values.metrics.enabled }}{{ .Values.metrics.port | toString | quote }}{{ else }}""{{ end }}
