# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/dgowing95/discordchatbot
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

discordToken: ""
redisHost: "dchatbot-redis-service.dchatbot.svc.cluster.local"
# Base URL of the llama.cpp server (OpenAI-compat). core appends /v1 itself, so do not include it here
llm_host: "http://dchatbot-llamacpp-service.dchatbot.svc.cluster.local:8080"
# llama.cpp does not authenticate; this is a non-empty placeholder for the OpenAI client
llm_pass: "llamacpp"

# Image generation (diffusion): separate pod (see diffusionservice/) + the
# generate_image LLM tool. enabled: false removes the pod/PVC and switches
# the tool off in core (IMAGE_GEN_ENABLED=false).
diffusion:
  enabled: true
  # Container image: built by the release workflow (diffusion-<tag> tags)
  image: ghcr.io/dgowing95/discordchatbot
  port: 8000
  # Optional: point core at a diffusion service outside the cluster
  # (default: the in-cluster {{ .Release.Name }}-diffusion-service)
  url: ""
  # HF repo id of the text-to-image model. sd-turbo is the smallest practical
  # one (~500MB, made for 1-4 step generation).
  model: stabilityai/sd-turbo
  # Sampler steps (sd-turbo: 1-4); lower = faster, slightly worse quality
  steps: 4
  width: 512
  height: 512
  # GPU memory mode: model = one pipeline component on the GPU at a time
  # (text encoder runs in CPU RAM — default); sequential = lowest VRAM,
  # slowest; none = everything on the GPU (needs ~4GB)
  offload: model
  # Max queued image requests (images are always generated one at a time)
  queueSize: 16
  # Optional: fixed seed for reproducible images (empty = random)
  seed: ""
  # CFG scale. Empty = the pipeline's own default (7.5 for SD1.5, 5.0 for
  # SDXL). Higher follows the prompt more closely and costs contrast;
  # Juggernaut XL suggests 3-7. Forced to 0.0 for distilled models
  # (sd-turbo, Lightning, LCM, Hyper), which are trained without guidance.
  guidance: ""
  # Baseline "what must not appear", merged BEHIND the per-request negative
  # prompt that the rewriter produces. That split is on purpose: the rewriter
  # writes what would spoil THIS image, this writes what the checkpoint always
  # gets wrong. It is also the floor when the rewriter is off or falls soft --
  # then it is the only negative prompt an image gets.
  #
  # Safe to leave set whatever the model is: it is dropped automatically on
  # distilled ones (sd-turbo, Lightning, LCM, Hyper), where diffusers skips the
  # unconditional branch and a negative prompt has no effect at all.
  #
  # Keep text/words/letters OUT of it — users do ask for text in images.
  negativePrompt: "blurry, lowres, jpeg artifacts, deformed, disfigured, bad anatomy, extra limbs, extra fingers, watermark, signature, cropped, out of frame"
  # Encode prompts past CLIP's 77-token (~55 word) window instead of silently
  # truncating them. false falls back to the truncating path.
  longPrompt: true
  # An LLM call in CORE (not the diffusion pod) that rewrites a request into an
  # SDXL-shaped prompt + negative prompt before it is sent. Covers both the
  # generate_image tool and the /generate_image slash command.
  promptRewrite:
    enabled: true
    timeout: 60
    # Empty = reuse the bot's own model/host/key. Set them to run the rewrite
    # somewhere else, exactly as sandbox.model/llmHost/apiKey can.
    model: ""
    llmHost: ""
    apiKey: ""
  # Optional: pin this pod to specific physical GPUs by CDI device name,
  # e.g. "nvidia.com/gpu=GPU-<uuid>" (comma-separated for several; `nvidia-smi
  # --query-gpu=uuid,name --format=csv` on the node lists them).
  #
  # Empty (default) = request `nvidia.com/gpu` from the device plugin and take
  # whatever it gives. Under GPU time-slicing that is NOT a specific card: slots
  # are fungible, so this pod can land on a GPU another workload has already
  # filled and every generation then fails with CUDA OOM — which is exactly what
  # happened in the homelab (see prod-values.yaml). Setting this DROPS the
  # nvidia.com/gpu request (the two are mutually exclusive — a resource request
  # makes the plugin overwrite NVIDIA_VISIBLE_DEVICES with "void") and pins the
  # pod deterministically. The node's container runtime must accept the env var:
  # `accept-nvidia-visible-devices-envvar-when-unprivileged = true`.
  #
  # Trade-off: pods pinned this way are invisible to the scheduler's GPU
  # accounting — nothing stops another pod requesting nvidia.com/gpu from being
  # placed on the same card.
  visibleDevices: ""

# Code sandbox (run_code_sandbox LLM tool): a nested SandboxAgent runs each
# task in a throwaway Docker container ON THE NODE (agents.sandbox
# DockerSandboxClient). Requires a Docker daemon on the node: its socket is
# mounted into the core pod via hostPath (sandbox.dockerSocketPath).
# enabled: false removes the mount and switches the tool off (SANDBOX_ENABLED=false).
sandbox:
  enabled: true
  # Container image for the sandbox workspace (pulled once onto the node)
  image: python:3.14-slim
  # Max model turns for one sandbox task
  maxTurns: 10
  # Wall-clock seconds before a sandbox task is stopped (container is removed)
  timeout: 600
  # Max seconds the sandbox's ask_user tool waits for a reply in its Discord
  # thread before telling the model to proceed on its own judgement
  askUserTimeout: 300
  # Wall-clock seconds allowed to persist a thread's workspace snapshot to
  # Redis on container teardown (runs AFTER timeout above; generous because,
  # with the Memory capability, this is also where its own two extra
  # local-model calls run)
  persistTimeout: 180
  # Seconds of silence on one HTTP request to the sandbox's LLM before the
  # client gives up on it (down from the OpenAI client's 600s default).
  # Catches a hung connection or a server that sends nothing; a server that
  # dribbles keep-alive padding while it works (e.g. OpenRouter's
  # non-streaming responses) resets this timer and is bounded only by the
  # timeout above.
  requestTimeout: 180
  # How many times that client retries a failed request (0 disables retries).
  # Worst-case latency for one model call is (1 + this) x requestTimeout.
  maxRetries: 2
  # Max size (bytes) of one thread's stored workspace snapshot in Redis
  snapshotMaxBytes: 50000000
  # How long an unused thread's workspace snapshot survives in Redis (seconds)
  snapshotTtlSeconds: 604800
  # Node path of the Docker socket to mount into the core pod
  dockerSocketPath: /var/run/docker.sock
  # LLM for the nested sandbox agent. Empty (default) = the main bot's LLM
  # (model / llm_host / llm_pass, i.e. the local llama.cpp server). To use a
  # hosted OpenAI-compatible API instead (e.g. OpenRouter), set all three:
  #   model: deepseek/deepseek-v4-flash-0731
  #   llmHost: https://openrouter.ai/api   (core appends /v1 itself)
  #   apiKey: sk-or-...
  model: ""
  llmHost: ""
  apiKey: ""

# llama.cpp server (replaces Ollama); which model it serves: the `model` value below
llamacpp:
  image: ghcr.io/ggml-org/llama.cpp:server-cuda  # CUDA build; the template sets the nvidia runtime class
  port: 8080
  gpuLayers: 99  # 99 = all layers on GPU
  parallel: 1
  # Hugging Face read token (hf_...) for gated model repos; empty = none.
  # Accept the repo's terms on HF first, then paste a read token here.
  hfToken: ""
  # Serve a GGUF file already on the volume instead of downloading from HF.
  # Path INSIDE the container: the llama.cpp PVC (hostPath .../ollama) is
  # mounted at /models, so a file copied to <pvc.hostPath>/ollama/foo.gguf is
  # /models/foo.gguf here. When set, the template swaps LLAMA_ARG_HF_REPO for
  # LLAMA_ARG_MODEL + LLAMA_ARG_ALIAS (the two are mutually exclusive, HF_REPO
  # wins) and `model` below becomes purely the name served in /v1/models —
  # still the one value core requests as MODEL. Empty = download from HF.
  modelPath: ""
  # KV cache quantization type for K/V context (llama.cpp -ctk / -ctv)
  cacheTypeK: q4_0
  cacheTypeV: q4_0
  # Max SWA context-checkpoints per slot (llama.cpp -ctxcp, default upstream: 32).
  # Checkpoints live inside the --cache-ram prompt-cache budget (host RAM, not
  # VRAM), ~150MiB each on top of a conversation's base state. For a multi-guild
  # bot with parallel=1, more resident conversations beats deeper rewind
  # granularity within one conversation — 32 saturates the default 8GiB
  # cache-ram budget after only ~9 conversations (observed evicting on almost
  # every request in prod). 6 keeps rewind useful (message_history windows are
  # small) while leaving much more headroom before eviction.
  ctxCheckpoints: 6
  # Verbosity threshold (llama.cpp -lv); 4 = debug, logs the offload/buffer summary at startup
  verbosity: 4
  # Escape hatch for any llama.cpp setting this chart does not model: every
  # CLI flag has a LLAMA_ARG_* env var, so put it here as name: value rather
  # than growing a value + template branch per flag. Rendered after everything
  # above, so repeating one of those names overrides it.
  #
  # The env names do NOT track the flag names — check `llama-server --help`
  # for the exact one (--reasoning-format is LLAMA_ARG_THINK, --reasoning-budget
  # is LLAMA_ARG_THINK_BUDGET). Example, for a model whose thinking is unusable:
  #   extraEnv:
  #     LLAMA_ARG_CHAT_TEMPLATE_KWARGS: '{"enable_thinking":false}'
  extraEnv: {}
  # Optional: pin to specific physical GPUs by CDI device name — same mechanism
  # and same trade-off as diffusion.visibleDevices (see there). Empty = request
  # llamacppResources.gpu slots from the device plugin. Relevant because
  # llama.cpp splits the model across EVERY device it is given, so on a mixed
  # node it will happily consume a card another workload needs.
  visibleDevices: ""
# Prompt context window (server --ctx-size)
llamacppContextLength: 40000
# Model — single value for the whole chart: core requests it (MODEL) and llama.cpp
# serves it (LLAMA_ARG_HF_REPO; <org>/<repo>[:quant], downloaded to the volume on
# first boot, reported back exactly in /v1/models). To swap models change only this.
# With llamacpp.modelPath set this is just the served name/alias — any string,
# as long as it is the same one core asks for.
model: "ggml-org/Qwen3.8-27B-GGUF:Q4_K_M"
# Reasoning effort sent to the LLM as the OpenAI-compat "reasoning_effort"
# field (low/medium/high).
reasoningEffort: "medium"
# Max model turns for ONE reply from the main agent (a turn = one model
# response, however many tool calls it carries). The SDK default of 10 is
# easily overrun by a reply that chains several sandbox/image calls, and
# overrunning loses the whole answer.
llmMaxTurns: 20
message_history: 5
# Send the model's <think> reasoning to Discord as spoiler-hidden follow-up
# message(s) (closed by default - click to reveal) instead of discarding it.
# Off by default: the reasoning is dropped.
showThinking: false
# core queue concurrency (see core/main.py): how many queue worker tasks run
# (each handles one message at a time; a per-channel lock keeps same-channel
# order) and the max messages waiting in the bounded queue (once full, new
# messages are dropped; a mention gets a short "busy" reply).
worker_count: 2
queue_max_size: 10

# Prometheus metrics: core serves /metrics on metrics.port and a
# ServiceMonitor (kube-prometheus-stack) scrapes it.
# enabled: false removes the pod port + ServiceMonitor and sets METRICS_PORT
# empty in the configmap (metrics disabled in the app).
metrics:
  enabled: true
  port: 9464
  # Prometheus scrape interval for the ServiceMonitor
  scrapeInterval: 30s

# Web-tool safety guard (OpenAI Moderations endpoint, see .env.example)
openaiApiKey: ""
# Optional: defaults to https://api.openai.com/v1 when empty
openaiBaseUrl: ""
# Optional: e.g. text-moderation-latest (when empty the API uses its default model)
moderationModel: ""
# Optional: retry/backoff tuning for 429 rate limits
guardMaxRetries: 2
guardRetryBackoff: 2
# Optional: seconds a verdict for the same query/URL stays cached (0 disables)
moderationCacheTtl: 600

pvc:
  redisSize: 5Gi
  llamacppSize: 45Gi
  diffusersSize: 15Gi
  hostPath: /data/kube/discordchatbot

coreResources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 1000m
    memory: 1024Mi

llamacppResources:
  limits:
    cpu: 6000m
    memory: 8000Mi
  requests:
    cpu: 6000m
    memory: 8000Mi
  gpu: 16

diffusionResources:
  limits:
    cpu: 6000m
    memory: 8000Mi
  requests:
    cpu: 6000m
    memory: 8000Mi
  gpu: 8


# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi