# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/dgowing95/discordchatbot
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent

discordToken: ""
# Name of a Secret you manage yourself (e.g. via External Secrets Operator or
# sealed-secrets) holding the core credentials, instead of the one this chart
# renders from discordToken / llm.apiKey / persona.apiKey / contentGuard.apiKey /
# brain.apiKey / subagents.apiKey / diffusion.promptRewrite.apiKey /
# diffusion.review.apiKey / research.apiKey (all ignored when this is set).
# Keys are the env var names: DISCORD_TOKEN (required), LLM_API_KEY,
# PERSONA_LLM_API_KEY, CONTENT_GUARD_API_KEY, BRAIN_LLM_API_KEY,
# SUBAGENT_LLM_API_KEY, IMAGE_PROMPT_LLM_API_KEY, IMAGE_REVIEW_LLM_API_KEY,
# RESEARCH_LLM_API_KEY (each optional - omit rather than leave empty).
existingSecret: ""
redisHost: "dchatbot-redis-service.dchatbot.svc.cluster.local"
# The bot's own LLM server, run by this chart, and the model it serves. The
# persona and the brain use it unless persona.* / brain.* name another.
llm:
  # Which local LLM server the chart runs: llamacpp (default) or strata.
  #   llamacpp: llama.cpp (llamacpp.* below); any GGUF model, dense or MoE.
  #   strata:   Strata (strata.* below), made for large mixture-of-experts
  #             models on consumer GPUs: every expert sits in system RAM, the
  #             most used ones are cached in VRAM, the rest run on the CPU. It
  #             only helps MoE models; a dense model stays on llama.cpp.
  #   none:     no local server: core uses llm.host (required then) with
  #             llm.apiKey, e.g. a hosted API like OpenRouter. No GPU is used.
  # Switching back is this one value. The llama.cpp volume is kept either way,
  # so its downloaded model is still there on the way back.
  engine: llamacpp
  # The model: one value for the whole chart. core requests it (LLM_MODEL) and
  # llama.cpp serves it (LLAMA_ARG_HF_REPO; <org>/<repo>[:quant], downloaded to
  # the volume on first boot, reported back exactly in /v1/models). To swap
  # models change only this. With llamacpp.modelPath set this is just the
  # served name/alias: any string, as long as it is the one core asks for.
  # With Strata it is only the requested name (Strata answers any name).
  model: "ggml-org/Qwen3.8-27B-GGUF:Q4_K_M"
  # Base URL of the LLM server (OpenAI-compat). core appends /v1 itself, so do
  # not include it here. Empty = the selected engine's in-cluster service. Set
  # it only for a server outside this chart, and then change it yourself when
  # switching engine.
  host: ""
  # The server's API key, for a server outside this chart that checks one
  # (rendered into the Secret as LLM_API_KEY). Empty = a placeholder, which is
  # all llama.cpp needs; with engine=strata core gets the Strata key instead.
  apiKey: ""
  # Requests the server answers at once (its slots). core reads the number
  # from the server's /props and keeps chat ahead of brain work when every
  # slot is busy; this is used only when /props does not report it. Empty =
  # llamacpp.parallel or strata.parallel, whichever engine runs.
  slots: ""
  # Slots kept free for chat replies when brain work could use them. With 1
  # slot, other work runs only while no chat reply is running or waiting.
  chatReserved: 1

# Image generation (diffusion): separate pod (see diffusionservice/) + the
# generate_image LLM tool. enabled: false removes the pod/PVC and switches
# the tool off in core (IMAGE_GEN_ENABLED=false).
diffusion:
  enabled: true
  # Container image: built by the release workflow (diffusion-<tag> tags)
  image: ghcr.io/dgowing95/discordchatbot
  port: 8000
  # Optional: point core at a diffusion service this release does not run,
  # e.g. another release's in-cluster service. When set, the chart renders no
  # diffusion pod, Service or volume (so no GPU is used); the image settings
  # below are then the other service's own. Empty = this release's
  # {{ .Release.Name }}-diffusion-service.
  url: ""
  # HF repo id of the text-to-image model. sd-turbo is the smallest practical
  # one (~500MB, made for 1-4 step generation). For prompt adherence and
  # editing, black-forest-labs/FLUX.2-klein-4B (steps: 4, 1024x1024,
  # quantize: nf4 on an 8GB card; ~15GB download): measured on an RTX 2070 at
  # 12-14s per image, 3.9-5.1GB VRAM and ~9GB RAM.
  model: stabilityai/sd-turbo
  # Sampler steps (sd-turbo: 1-4; FLUX.2 klein: 4); lower = faster, slightly worse quality
  steps: 4
  width: 512
  height: 512
  # GPU memory mode: model = one pipeline component on the GPU at a time
  # (text encoder runs in CPU RAM — default); sequential = lowest VRAM,
  # slowest; none = everything on the GPU (needs ~4GB)
  offload: model
  # none | nf4: load FLUX.2 [klein]'s transformer and text encoder in 4-bit,
  # which is what fits it on an 8GB card. Ignored for SD/SDXL models.
  quantize: none
  # Max queued image requests (images are always generated one at a time)
  queueSize: 16
  # Optional: fixed seed for reproducible images (empty = random)
  seed: ""
  # CFG scale. Empty = the pipeline's own default (7.5 for SD1.5, 5.0 for
  # SDXL). Higher follows the prompt more closely and costs contrast;
  # Juggernaut XL suggests 3-7. Forced to 0.0 for distilled models
  # (sd-turbo, Lightning, LCM, Hyper), which are trained without guidance.
  guidance: ""
  # Baseline "what must not appear", merged BEHIND the per-request negative
  # prompt that the rewriter produces. That split is on purpose: the rewriter
  # writes what would spoil THIS image, this writes what the checkpoint always
  # gets wrong. It is also the floor when the rewriter is off or falls soft --
  # then it is the only negative prompt an image gets.
  #
  # Safe to leave set whatever the model is: it is dropped automatically on
  # distilled ones (sd-turbo, Lightning, LCM, Hyper), where diffusers skips the
  # unconditional branch and a negative prompt has no effect at all.
  #
  # Keep text/words/letters OUT of it — users do ask for text in images. And
  # keep anatomy words like "deformed, disfigured, bad anatomy" out: they pull
  # deliberately exaggerated bodies (stick-thin arms, a giant) back to normal.
  negativePrompt: "blurry, lowres, jpeg artifacts, extra limbs, extra fingers, watermark, signature, cropped, out of frame"
  # Encode prompts past CLIP's 77-token (~55 word) window instead of silently
  # truncating them. false falls back to the truncating path.
  longPrompt: true
  # An LLM call in CORE (not the diffusion pod) that rewrites a request into an
  # SDXL-shaped prompt + negative prompt before it is sent. Covers both the
  # generate_image tool and the /generate_image slash command.
  promptRewrite:
    enabled: true
    timeout: 60
    # Empty = reuse the bot's own model/host/key. Set them to run the rewrite
    # somewhere else, exactly as brain.model/llmHost/apiKey can.
    model: ""
    llmHost: ""
    apiKey: ""
  # A CORE-side vision call that looks at each generated image before it is
  # posted: what it shows (so the bot's caption is true) and what was asked for
  # but is missing, which earns `retries` more attempts with that stressed.
  # Each retry is a whole extra generation plus another check. 0 = check only.
  review:
    enabled: true
    retries: 1
    timeout: 60
    # Empty = the bot's own model/host/key, which must then be a vision model
    # (llama.cpp with the model's mmproj loaded). Set them to check elsewhere.
    model: ""
    llmHost: ""
    apiKey: ""
  # Optional: pin this pod to specific physical GPUs by CDI device name,
  # e.g. "nvidia.com/gpu=GPU-<uuid>" (comma-separated for several; `nvidia-smi
  # --query-gpu=uuid,name --format=csv` on the node lists them).
  #
  # Empty (default) = request `nvidia.com/gpu` from the device plugin and take
  # whatever it gives. Under GPU time-slicing that is NOT a specific card: slots
  # are fungible, so this pod can land on a GPU another workload has already
  # filled and every generation then fails with CUDA OOM — which is exactly what
  # happened in the homelab (see prod-values.yaml). Setting this DROPS the
  # nvidia.com/gpu request (the two are mutually exclusive — a resource request
  # makes the plugin overwrite NVIDIA_VISIBLE_DEVICES with "void") and pins the
  # pod deterministically. The node's container runtime must accept the env var:
  # `accept-nvidia-visible-devices-envvar-when-unprivileged = true`.
  #
  # Trade-off: pods pinned this way are invisible to the scheduler's GPU
  # accounting — nothing stops another pod requesting nvidia.com/gpu from being
  # placed on the same card.
  visibleDevices: ""

# Reading links (the fetch_url tool). Pages, Reddit threads, Steam store pages
# and YouTube captions are read in core and cached in Redis, so a link still
# in the channel is not fetched again on every reply.
webFetch:
  # Characters of a page the model gets per call; longer pages come in parts
  partChars: 10000
  # Most characters of one page kept (all parts together)
  maxChars: 200000
  # Most bytes downloaded for one page, and seconds to wait for it
  maxBytes: 5000000
  timeout: 15
  # How long a read page / a YouTube transcript / a failure stays cached
  cacheTtlSeconds: 21600
  videoCacheTtlSeconds: 2592000
  failureCacheTtlSeconds: 300
  # A plain fetch with less text than this goes to the browser (if enabled)
  browserMinChars: 400

# web_search: searches, reads the top results itself (through fetch_url's
# reader and cache) and has an LLM call write a short brief with sources.
# That call is one more request to the LLM per search; with llamacpp.parallel
# at 1 it also takes the slot, so llmHost can point it at another server.
research:
  # false = return the search results alone (no pages read, no brief)
  enabled: true
  # Results read in full (at most 5), and characters of each given to the brief
  pages: 3
  pageChars: 6000
  # Seconds to wait for those pages, and for the brief
  fetchTimeout: 25
  timeout: 90
  # Empty = reuse the bot's own model/host/key.
  model: ""
  llmHost: ""
  apiKey: ""

# Headless browser (browserservice/) for pages whose text only appears once
# their scripts run. core tries a plain fetch first and only asks the browser
# when that comes back almost empty. enabled: false removes the pod; fetch_url
# still works, without that fallback.
browser:
  enabled: true
  # Container image: built by the release workflow (browser-<tag> tags)
  image: ghcr.io/dgowing95/discordchatbot
  port: 8000
  # Optional: point core at a browser service outside the cluster
  url: ""
  # Pages rendered at once, and renders allowed to wait before a 503
  concurrency: 2
  queueSize: 8
  # Seconds for one render, and seconds to let a page's scripts settle
  timeout: 30
  settleSeconds: 5
  # In-memory /dev/shm for Chromium; counts against browserResources memory
  shmSize: 512Mi
  # A NetworkPolicy: only core may call the browser, and the browser may only
  # reach the public internet (and cluster DNS). It does nothing unless the
  # cluster's network plugin enforces NetworkPolicy; the service's own check
  # on every request a page makes is the main guard either way. The pod's
  # probes run inside it (exec), so the policy does not block them.
  networkPolicy: true
  # Labels of the cluster DNS pods the policy lets the browser query
  dnsPodLabels:
    k8s-app: kube-dns

# Schedules and message rules (docs/automations.md), stored in Redis.
# enabled: false stops running them and hides /schedule, /rule and the chat
# tools, but keeps what is stored. A maxPerGuild of 0 blocks new entries of
# that kind; lowering a limit keeps existing entries.
automations:
  enabled: true
  # Default IANA timezone for new schedules (each can override it)
  timezone: Europe/London
schedules:
  # Minimum hours between runs of a recurring schedule (one-offs are exempt)
  minIntervalHours: 4
  maxPerGuild: 1
rules:
  maxPerGuild: 4
  # Seconds before the same rule can fire again
  cooldownSeconds: 60
# Follow-ups: one-off schedules the bot sets itself ("check the poll when it
# ends"). Their own quota; any two in a server are at least
# schedules.minIntervalHours apart.
followups:
  maxPerGuild: 3
# Discord server events (create / list / move / cancel). The bot's role needs
# the Create Events permission, and so does the person asking.
events:
  enabled: true

# Voice calls (docs/voice.md): /voice join or "join voice", then
# "hey <name>, ..." out loud. Two extra pieces, both CPU only:
#   * a voice sidecar container in the core pod (voicesidecar/): Discord voice
#     I/O with @discordjs/voice, which (unlike discord.py) can hear under
#     Discord's DAVE encryption. core talks to it on localhost.
#   * a speech pod (speechservice/): Whisper speech-to-text and Kokoro
#     text-to-speech, with its models on the speech PVC.
# enabled: false removes both and hides /voice and the voice tools.
voice:
  enabled: true
  # Container images: built by the release workflow (voice-<tag>, speech-<tag>)
  image: ghcr.io/dgowing95/discordchatbot
  # Port of the core <-> sidecar WebSocket inside the core pod
  bridgePort: 8765
  speechPort: 8000
  # Empty = the in-cluster speech service
  speechUrl: ""
  # Seconds the bot stays after the last person leaves the call
  idleLeaveSeconds: 30
  # Transcribed clips kept in a call's prompt, and how many more it grows by
  # before rebasing (an anchored window, so llama.cpp can reuse its cache)
  historyLimit: 10
  historyRefresh: 10
  # After someone says only the wake phrase, their next words within this
  # many seconds count as the request
  followupSeconds: 8
  # true lets the model think before a spoken reply (slower first word)
  thinking: false
  # Kokoro voice for servers that have not picked one (/voice voice)
  defaultVoice: af_heart
  # Silence (ms) that ends someone's utterance
  silenceMs: 800
  # Minimum seconds between two cache-warming prefills of a call's prompt
  prefillMinSeconds: 5
  # Speech service: Whisper model, CPU threads per job and jobs at once,
  # and how many requests may wait per kind before it answers 503
  sttModel: small.en
  sttThreads: 4
  sttConcurrency: 2
  ttsThreads: 4
  ttsConcurrency: 2
  queueSize: 16

# Tier 3 workflows: a big job in its own thread. A manager plans it, the
# requester approves the plan (Approve / Edit / Cancel), helpers (subagents)
# do the steps one at a time, and the bot replies in the channel when it ends.
# Started by the brain (start_workflow) or with /task.
workflows:
  # false removes /task and start_workflow. Workflows are the heaviest load
  # on a one-slot LLM server.
  enabled: true
  # Seconds a helper's question in the thread waits for the requester.
  askTimeout: 300
  # Seconds the plan waits for Approve before it is cancelled.
  planApprovalSeconds: 900
  # Changes a plan may get before it must be approved or cancelled.
  planRevisions: 3
  # Steps in one plan.
  maxSteps: 8
  # Caps on ONE workflow: wall-clock seconds (1 h), model turns across all
  # its agents, and tokens in and out (4M; 0 = off). Running out stops it with
  # what exists.
  timeout: 3600
  maxTurns: 300
  maxTokens: 4000000
  # Dollars one workflow may cost, as the LLM provider reports it (OpenRouter
  # does; llama.cpp does not). 0 = off. Raise it for a pricier model.
  maxCost: 0.50
  # Workflows running at once in one server.
  maxPerGuild: 1

# The helpers (subagents) of a workflow. Empty model/llmHost/apiKey fall back
# to the brain's (brain.*), then the bot's own (llm.*).
subagents:
  model: ""
  llmHost: ""
  apiKey: ""
  # Sent as "reasoning_effort" (low/medium/high). Empty = the brain's.
  reasoningEffort: ""
  # Wall-clock seconds ONE model call may take. Empty = brain.callTimeout.
  callTimeout: ""
  # Backstop on one helper's model turns.
  maxTurns: 100
  # Output tokens, thinking included, one helper's model call may make; a call
  # that uses them all stops the helper at a limit. 0 = off.
  maxOutputTokens: 32000
  # Reasoning effort of research steps (low/medium/high); others use reasoningEffort.
  researcherReasoningEffort: "low"
  # Researchers running at once, cut to the slots a self-hosted server has beside chat's.
  maxConcurrent: 2

# llama.cpp server (replaces Ollama); which model it serves: the `model` value below
llamacpp:
  image: ghcr.io/ggml-org/llama.cpp:server-cuda  # CUDA build; the template sets the nvidia runtime class
  port: 8080
  gpuLayers: 99  # 99 = all layers on GPU
  # Requests answered at the same time (slots)
  parallel: 1
  # Context per slot in tokens: the server's --ctx-size is this x parallel
  contextPerSlot: 40000
  # Hugging Face read token (hf_...) for gated model repos; empty = none.
  # Accept the repo's terms on HF first, then paste a read token here.
  hfToken: ""
  # Name of a Secret you manage yourself with key HF_TOKEN, instead of the one
  # this chart renders from hfToken (ignored when this is set). Empty = none.
  existingSecret: ""
  # Serve a GGUF file already on the volume instead of downloading from HF.
  # Path INSIDE the container: the llama.cpp PVC (hostPath .../ollama) is
  # mounted at /models, so a file copied to <pvc.hostPath>/ollama/foo.gguf is
  # /models/foo.gguf here. When set, the template swaps LLAMA_ARG_HF_REPO for
  # LLAMA_ARG_MODEL + LLAMA_ARG_ALIAS (the two are mutually exclusive, HF_REPO
  # wins) and llm.model becomes purely the name served in /v1/models, still
  # the one value core requests as LLM_MODEL. Empty = download from HF.
  modelPath: ""
  # Prompt cache in host RAM, MiB (llama.cpp --cache-ram). Empty = llama.cpp's
  # default (8192); -1 = no limit, 0 = off.
  cacheRamMiB: ""
  # KV cache quantization type for K/V context (llama.cpp -ctk / -ctv)
  cacheTypeK: q4_0
  cacheTypeV: q4_0
  # Max SWA context-checkpoints per slot (llama.cpp -ctxcp, default upstream: 32).
  # Checkpoints live inside the --cache-ram prompt-cache budget (host RAM, not
  # VRAM), ~150MiB each on top of a conversation's base state. For a multi-guild
  # bot with parallel=1, more resident conversations beats deeper rewind
  # granularity within one conversation — 32 saturates the default 8GiB
  # cache-ram budget after only ~9 conversations (observed evicting on almost
  # every request in prod). 6 keeps rewind useful (history.limit windows are
  # small) while leaving much more headroom before eviction.
  ctxCheckpoints: 6
  # Verbosity threshold (llama.cpp -lv); 4 = debug, logs the offload/buffer summary at startup
  verbosity: 4
  # Escape hatch for any llama.cpp setting this chart does not model: every
  # CLI flag has a LLAMA_ARG_* env var, so put it here as name: value rather
  # than growing a value + template branch per flag. Rendered after everything
  # above, so repeating one of those names overrides it.
  #
  # The env names do NOT track the flag names — check `llama-server --help`
  # for the exact one (--reasoning-format is LLAMA_ARG_THINK, --reasoning-budget
  # is LLAMA_ARG_THINK_BUDGET). Example, for a model whose thinking is unusable:
  #   extraEnv:
  #     LLAMA_ARG_CHAT_TEMPLATE_KWARGS: '{"enable_thinking":false}'
  extraEnv: {}
  # Optional: pin to specific physical GPUs by CDI device name — same mechanism
  # and same trade-off as diffusion.visibleDevices (see there). Empty = request
  # llamacppResources.gpu slots from the device plugin. Relevant because
  # llama.cpp splits the model across EVERY device it is given, so on a mixed
  # node it will happily consume a card another workload needs.
  visibleDevices: ""
  # Size of an in-memory /dev/shm for the llamacpp pod (e.g. "2Gi"); empty =
  # the container runtime's 64MB default. Needed for multi-GPU tensor
  # parallelism (extraEnv LLAMA_ARG_SPLIT_MODE: tensor): llama.cpp syncs the
  # cards with NCCL, which goes through shared memory when the GPUs cannot
  # reach each other directly (GeForce cards have no P2P), and on 64MB it dies
  # at the first request with `CUDA error: unhandled system error` in
  # ncclGroupEnd(). A memory-backed emptyDir: pages written count against
  # llamacppResources.limits.memory (NCCL itself uses a few MB).
  shmSize: ""
# Strata server (llm.engine: strata). Settings are the image's own env vars
# (Strata's docs/DOCKER.md), named in brackets. Every start makes the running
# settings equal these: Strata otherwise keeps settings saved by an earlier
# start, so a value removed here would stay in force.
strata:
  # Pick the flavour for the node's GPUs: -cuda13 (NVIDIA driver 580+),
  # -cuda12 (575+); ROCm and SYCL builds exist too. Pin a version.
  image: ghcr.io/niko1221/strata:0.2.3-cuda13
  port: 8080
  # Optional: also open the API on this port on every node (a NodePort, e.g.
  # 31434, the port llama.cpp's Service uses), for clients outside the
  # cluster; they need strata.apiKey too. Empty = in-cluster only.
  #
  # To keep 31434 when switching from llama.cpp, do it in two upgrades
  # (engine first, then this port). Helm and ArgoCD create the new Service
  # before deleting the old one, and Kubernetes refuses a port that the
  # llama.cpp Service still holds ("provided port is already allocated").
  nodePort: ""
  # Model family (FAMILY) and size (MODEL), e.g. qwen + IQ3_XXS. RAM for the
  # experts per Strata's docs/MODELS.md: Q2_0 34 GB, IQ2_XS 35.5, IQ3_XXS 43,
  # IQ3_S 50, plus ~6 GB for the rest; see strataResources.
  family: qwen
  model: IQ3_XXS
  # GGUF files you already have (MODEL_PATH): a folder of one model's shards,
  # as seen INSIDE the container. With modelHostPath set it is mounted there
  # read-only. Empty = Strata downloads the model into its volume (tens of GB;
  # an mmproj-*.gguf next to the shards also saves the vision download).
  modelPath: ""
  modelHostPath: ""
  # Context PER SLOT (CONTEXT): a number of tokens, or 32k / 64k / 128k /
  # 256k. Like llamacpp.contextPerSlot, the total is this x parallel.
  context: 32k
  # Requests answered at the same time, 1-8 (PARALLEL): the server's slots.
  # Not the same number as queue.workers (core's message workers).
  parallel: 2
  # Picture input (VISION): off | on | cpu | gpu. on = the CPU reader below
  # 24 GB of VRAM. The image check (diffusion.review) needs it on.
  vision: cpu
  # KV cache format (KV): int8 (default), q4_0, k8v4, fp16
  kv: int8
  # Card numbers inside the container (GPUS, e.g. "0,1"), or a role per card
  # (GPU_ROLES, e.g. "1=main,0=helper"; not with gpus). Empty = Strata's
  # choice. Several cards are a layer split and need no P2P/NVLink.
  gpus: ""
  gpuRoles: ""
  # Advanced engine settings (STRATA_SET), space separated KEY=VALUE, e.g.
  # "resident-budget-gib=20" to keep fewer experts in RAM (much slower prompts)
  set: ""
  # The API key core and Strata share. Strata never serves without one, so
  # set this or existingSecret (key STRATA_API_KEY); the render fails
  # otherwise. 16+ characters, e.g. `openssl rand -hex 24`.
  apiKey: ""
  existingSecret: ""
  # Pin to physical GPUs by CDI device name: same mechanism and trade-off as
  # diffusion.visibleDevices (see there). Empty = request strataResources.gpu
  # slots from the device plugin.
  visibleDevices: ""
  # In-memory /dev/shm; counts against strataResources.limits.memory
  shmSize: 2Gi
  # Node folder for Strata's /data (prepared model data, the draft layer,
  # settings, logs). MUST be an SSD/NVMe: the engine reads a large table at
  # random on every token, and a spinning disk stalls it. Empty =
  # <pvc.hostPath>/strata.
  hostPath: ""
  # Raise the pod's locked-memory and address-space limits at start. Strata
  # page-locks the RAM that holds the experts and CUDA needs an unlimited
  # address space, but Kubernetes has no per-pod ulimit and pods often get
  # an 8 MiB locked-memory limit. true adds the SYS_RESOURCE capability and
  # raises both limits (prlimit) before the server starts. false = the node
  # must already give pods unlimited locked memory.
  raiseLimits: true
  # Any other env var for the image, as name: value. Rendered last, so
  # repeating a name above overrides it.
  extraEnv: {}
# The persona: the personality that answers in chat (Tier 1). Its LLM is the
# bot's own (llm.*) unless model/llmHost/apiKey name another (core appends /v1
# to llmHost). A key is only ever sent to its own server: a persona on another
# host with no apiKey sends none.
persona:
  model: ""
  llmHost: ""
  apiKey: ""
  # Reasoning effort sent to the LLM as the OpenAI-compat "reasoning_effort"
  # field (low/medium/high).
  reasoningEffort: "medium"
  # Max model turns for ONE reply (a turn = one model response, however many
  # tool calls it carries). The persona has one tool, ask_brain, so a reply
  # is at most: ask the brain, maybe again, answer. An overrun is still
  # answered from what it has.
  maxTurns: 4
  # Wall-clock seconds ONE model call may take, the OpenAI client's own
  # retries included. The client's timeout is per-read, so a server that keeps
  # the connection warm while it works (OpenRouter pads non-streaming
  # responses) is bounded only by this.
  callTimeout: 600
# Skills: how the brain solved a recurring job, saved per server in Redis and
# reused next time. Anyone in the server sees and manages them (/skills); every
# change is a new version and a delete can be undone.
skills:
  enabled: true
  maxPerGuild: 100      # live skills per server
  maxVersions: 50       # versions kept per skill (the oldest go first)
  maxBytes: 65536       # one skill, steps and files together
  maxBodyChars: 8000    # the steps
  maxFiles: 10          # files kept with one skill
  indexMax: 20          # skills named in the brain's task; the rest are found by search
  reflection:
    # After a long brain job, one background call decides whether it is
    # worth saving as a skill.
    enabled: true
    minToolCalls: 6
  curator:
    # Once a day per server with minSkills+ skills: merge overlapping ones,
    # retire ones unused for retireDays, sharpen descriptions. Every change
    # is a version or a soft delete, so it can be undone with /skills.
    enabled: true
    intervalHours: 24
    minSkills: 5
    retireDays: 60

# The brain: the agent that does the work in the server's workspace. Its LLM is the
# bot's own (llm.*) unless these name another. To use a hosted
# OpenAI-compatible API instead (e.g. OpenRouter), set all three:
#   model: deepseek/deepseek-v4.1-flash-1017
#   llmHost: https://openrouter.ai/api   (core appends /v1 itself)
#   apiKey: sk-or-...
# The bot's own key is never sent to another host: without apiKey there, the
# brain sends none.
brain:
  model: ""
  llmHost: ""
  apiKey: ""
  # Sent as "reasoning_effort" (low/medium/high).
  reasoningEffort: "medium"
  # Wall-clock seconds ONE model call may take, the client's two retries
  # included; also its per-read timeout. Bounds a server that keeps the
  # connection alive with padding while it works.
  callTimeout: 600
  # Backstops on ONE brain call, which works inline in the channel. Not
  # budgets: the loop guard (repeatLimit) is what stops a stuck call.
  #   maxTurns: model turns. timeout: wall-clock seconds, lane waits included.
  maxTurns: 100
  timeout: 1800
  # The same tool with the same arguments this many times in a row (or eight
  # calls that bring nothing new) earns a warning, and a second time stops
  # the call with what it has so far.
  repeatLimit: 3
  # Tool outputs kept whole in a long call's prompt; older ones are cut to
  # their first and last 400 characters.
  trimKeepRecent: 6
  # Seconds the brain waits for the requester to answer a question it asked
  # in the channel (ask_user); counted inside timeout.
  askTimeout: 120
  # Brain calls at once. Each one on a queue worker starts a spare worker, so
  # chat keeps queue.workers free meanwhile; a call that finds every slot
  # busy for queueWait seconds is told the bot is busy.
  maxConcurrent: 3
  queueWait: 120
  # The server workspace: ONE long-lived Docker container per Discord server,
  # on the NODE's Docker daemon (its socket is always mounted into the core
  # pod: Docker is required, and core exits at startup without it). Kept
  # between tasks and core restarts, saved to Redis on a timer and before it
  # stops, stopped after idleSeconds unused. Each task gets its own folder;
  # shared/ holds what the server keeps. Containers are labelled with the
  # namespace and release name, so two releases on one node never remove
  # each other's.
  workspace:
    # Container image (pulled onto the node at startup if missing)
    image: python:3.14-slim
    # Node path of the Docker socket to mount into the core pod
    dockerSocketPath: /var/run/docker.sock
    # Per container. memoryLimit in Docker's notation (4g, 512m; swap capped
    # at the same figure), cpuLimit in CPUs (e.g. 2 or 0.5), pidsLimit in
    # processes (0 = none). Empty = no cap. The containers run outside
    # Kubernetes, so no pod limit or scheduler accounting covers them:
    # without a cap one heavy task can take RAM that a pod on the node
    # (Strata's experts, say) was planned around.
    memoryLimit: ""
    cpuLimit: ""
    pidsLimit: 512
    # Seconds unused before a workspace is saved and stopped
    idleSeconds: 900
    # Seconds between saves of a running workspace that changed (0 = only
    # when it stops)
    snapshotIntervalSeconds: 1800
    # Workspaces running at once in this core pod; the least recently used
    # idle one stops first, and a task waits rather than stop a busy one
    maxWarm: 4
    # Task folders older than this many hours are deleted
    jobRetentionHours: 72
    # Max size (bytes) of one server's saved workspace in Redis; over it the
    # previous save is kept and /workspace status says so
    snapshotMaxBytes: 50000000
    # How long an unused server's saved workspace survives in Redis (seconds)
    snapshotTtlSeconds: 604800
    # Seconds allowed for one save, and for all of them when core shuts down
    snapshotTimeout: 120
    # Most bytes of chat files (uploads, the bot's own pictures) copied into a
    # task's in/ folder, all files together. Keep it well under
    # snapshotMaxBytes: in/ is saved with the workspace.
    inputMaxBytes: 25000000
    # Start a server's workspace when the bot is about to answer there, so
    # the brain finds it ready (every brain call runs in it)
    prewarm: true
# Which chat messages go into a prompt (core/classes/history_policy.py).
#   limit:    messages in a window, the trigger included.
#   mode:
#     sliding:  always the newest `limit` messages. The start of the prompt
#               changes on every message, so llama.cpp re-prefills it all.
#     anchored: the start stays fixed and new messages are appended, so the
#               server can reuse its cached prefix; the window jumps to the
#               newest `limit` messages once refreshMessages more channel
#               messages (bot replies included) have arrived.
# reserveTokens is held back from the llama.cpp per-slot context for the system
# prompt, tool schemas, tool results and the answer; older history messages are
# dropped whole when the rest would not fit.
history:
  limit: 5
  mode: sliding
  refreshMessages: 10
  reserveTokens: 12000
# Send the model's <think> reasoning to Discord as spoiler-hidden follow-up
# message(s) (closed by default - click to reveal) instead of discarding it.
# Off by default: the reasoning is dropped.
showThinking: false
# Post each release's "What's new" feature list once per server, after the
# bot's first reply on the new version (notes: core/whats_new.md).
whatsNew:
  enabled: true
# Opportunity for two short conversational messages; the model may choose one.
# Set chance to 0 to disable. Cooldown counts delivered replies per channel.
doubleReply:
  chance: 0.08
  cooldownReplies: 10
# core queue concurrency (see core/main.py): how many queue worker tasks run
# (each handles one message at a time; a per-channel lock keeps same-channel
# order) and the max messages waiting in the bounded queue (once full, new
# messages are dropped; a mention gets a short "busy" reply).
queue:
  workers: 2
  maxSize: 10

# Prometheus metrics. One switch covers both scrape targets:
#   - core serves the discord_bot_* series on metrics.port
#   - llama.cpp serves its own llamacpp:* series on its API port
#     (LLAMA_ARG_ENDPOINT_METRICS, off upstream by default) — including
#     llamacpp:n_tokens_max, the high watermark of context actually used
# with a ServiceMonitor (kube-prometheus-stack) per target.
# enabled: false removes the pod port + both ServiceMonitors, drops the
# llama.cpp flag, and sets METRICS_PORT empty in the configmap (metrics
# disabled in the app).
metrics:
  enabled: true
  port: 9464
  # Prometheus scrape interval for the ServiceMonitor
  scrapeInterval: 30s

# Safety guard on web and workspace input (an OpenAI-compatible Moderations
# endpoint, see .env.example). Fails open: no key, or no answer, allows.
contentGuard:
  enabled: true
  # API key for the moderation call (rendered into the Secret)
  apiKey: ""
  # Optional: defaults to https://api.openai.com/v1 when empty
  baseUrl: ""
  # Optional: e.g. text-moderation-latest (when empty the API uses its default model)
  model: ""
  # Retry/backoff tuning for 429 rate limits
  maxRetries: 2
  retryBackoff: 2
  # Seconds a verdict for the same query/URL stays cached (0 disables)
  cacheTtlSeconds: 600
  # Per-request debug logging from the guard
  debug: false

pvc:
  redisSize: 5Gi
  llamacppSize: 45Gi
  diffusersSize: 15Gi
  # Strata's /data (llm.engine: strata only); a downloaded model lands here
  # too unless strata.modelHostPath is used. Its PV/PVC are kept by Helm and
  # ArgoCD once created, so switching back to llama.cpp leaves them bound,
  # and so does `helm uninstall`: delete them by hand (kubectl delete pvc
  # strata-pv-claim, then the <release>-pvc-strata PV) to free the space or
  # before installing under another release name in the same namespace. The
  # files on the node are never deleted by either.
  strataSize: 120Gi
  # Whisper + Kokoro models (voice.enabled only)
  speechSize: 3Gi
  hostPath: /data/kube/discordchatbot

coreResources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 1000m
    memory: 1024Mi

llamacppResources:
  limits:
    cpu: 6000m
    memory: 8000Mi
  requests:
    cpu: 6000m
    memory: 8000Mi
  gpu: 16

# Strata (llm.engine: strata only). Requests == limits (Guaranteed QoS), so the
# RAM the experts need is reserved. Size memory from the model: its experts
# + ~6 GB (strata.model) + strata.shmSize + some headroom. The CPU limit also
# caps the CPU workers that compute the experts not held on the GPU (one per
# physical core by default), so a low limit slows every answer.
strataResources:
  limits:
    cpu: 16000m
    memory: 56Gi
  requests:
    cpu: 16000m
    memory: 56Gi
  gpu: 1

# Voice (voice.enabled only). Speech transcribes everything said in a call,
# so it gets real CPU; the sidecar only moves audio.
speechResources:
  limits:
    cpu: 8000m
    memory: 4096Mi
  requests:
    cpu: 2000m
    memory: 2048Mi

# Browser (browser.enabled only): one Chromium, a few hundred MB per page
# rendered at once (browser.concurrency) plus browser.shmSize.
browserResources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

voiceSidecarResources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

diffusionResources:
  limits:
    cpu: 6000m
    memory: 8000Mi
  requests:
    cpu: 6000m
    memory: 8000Mi
  gpu: 8
