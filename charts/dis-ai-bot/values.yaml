# Default values for helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: ghcr.io/dgowing95/discordchatbot
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

discordToken: ""
redisHost: "dchatbot-redis-service.dchatbot.svc.cluster.local"
# Base URL of the llama.cpp server (OpenAI-compat). core appends /v1 itself, so do not include it here
llm_host: "http://dchatbot-llamacpp-service.dchatbot.svc.cluster.local:8080"
# llama.cpp does not authenticate; this is a non-empty placeholder for the OpenAI client
llm_pass: "llamacpp"

image_model: "stable-diffusion-v1-5/stable-diffusion-v1-5"
diffusion_url: "localhost"
diffusersGpuLimit: 8

# llama.cpp server (replaces Ollama); which model it serves: the `model` value below
llamacpp:
  image: ghcr.io/ggml-org/llama.cpp:server-cuda  # CUDA build; the template sets the nvidia runtime class
  port: 8080
  gpuLayers: 99  # 99 = all layers on GPU
  parallel: 1
  # KV cache quantization type for K/V context (llama.cpp -ctk / -ctv)
  cacheTypeK: q4_0
  cacheTypeV: q4_0
# Prompt context window (server --ctx-size)
llamacppContextLength: 40000
# Model — single value for the whole chart: core requests it (MODEL) and llama.cpp
# serves it (LLAMA_ARG_HF_REPO; <org>/<repo>[:quant], downloaded to the volume on
# first boot, reported back exactly in /v1/models). To swap models change only this.
model: ggml-org/Qwen3.8-27B-GGUF:Q4_K_M
message_history: 5

# Web-tool safety guard (OpenAI Moderations endpoint, see .env.example)
openaiApiKey: ""
# Optional: defaults to https://api.openai.com/v1 when empty
openaiBaseUrl: ""
# Optional: e.g. text-moderation-latest (when empty the API uses its default model)
moderationModel: ""
# Optional: retry/backoff tuning for 429 rate limits
guardMaxRetries: 2
guardRetryBackoff: 2
# Optional: seconds a verdict for the same query/URL stays cached (0 disables)
moderationCacheTtl: 600

pvc:
  redisSize: 5Gi
  llamacppSize: 45Gi
  diffusersSize: 15Gi
  hostPath: /data/kube/discordchatbot

coreResources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 1000m
    memory: 1024Mi

llamacppResources:
  limits:
    cpu: 6000m
    memory: 8000Mi
  requests:
    cpu: 6000m
    memory: 8000Mi
  gpu: 16

diffusionResources:
  limits:
    cpu: 6000m
    memory: 8000Mi
  requests:
    cpu: 6000m
    memory: 8000Mi
  gpu: 8


# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi