services:
  redis:
    image: redis:7.4.1
    volumes:
      - data:/data
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
  llamacpp:
    # Official llama.cpp server (OpenAI-compatible API); configured via LLAMA_ARG_* env vars:
    # https://github.com/ggml-org/llama.cpp/blob/master/tools/cli/README.md#common-params
    # One of the two LLM servers; COMPOSE_PROFILES in .env picks which runs
    # (llamacpp or strata), so the two never fight over the GPU.
    profiles: [llamacpp]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "8081:8081"  # dev uses 8081 (8080 is taken locally); the helm chart uses 8080
    environment:
      # Model cache (the ollama_data volume); GGUF is downloaded once, then cached
      - LLAMA_CACHE=/models
      # Same value core requests as MODEL; to swap models change it in .env and `docker compose up -d`
      - LLAMA_ARG_HF_REPO=${MODEL:-ggml-org/Qwen3.8-27B-GGUF:Q4_K_M}
      # Keep LLAMA_ARG_PORT in sync with ports: above and LLM_HOST in .env
      - LLAMA_ARG_N_GPU_LAYERS=99
      # KV cache quantization for K/V context (llama.cpp -ctk/-ctv); override in .env
      - LLAMA_ARG_CACHE_TYPE_K=${LLAMA_ARG_CACHE_TYPE_K:-q4_0}
      - LLAMA_ARG_CACHE_TYPE_V=${LLAMA_ARG_CACHE_TYPE_V:-q4_0}
      - LLAMA_ARG_CTX_SIZE=80000
      - LLAMA_ARG_PORT=8081
      - LLAMA_ARG_N_PARALLEL=1
      # -lv: 3 (default) hides the offload/buffer summary; 4 (debug) logs it at startup
      - LLAMA_ARG_LOG_VERBOSITY=4
    volumes:
      - ollama_data:/models  # pre-existing volume from the ollama days
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  strata:
    # Strata (COMPOSE_PROFILES=strata): the alternative LLM server for large
    # mixture-of-experts models; settings are its image's env vars (Strata's
    # docs/DOCKER.md). It always checks a key, so LLM_PASS in .env is the key
    # for both sides. Point core at it with LLM_HOST=http://strata:8080.
    profiles: [strata]
    image: ghcr.io/niko1221/strata:${STRATA_IMAGE_TAG:-0.2.3-cuda13}
    # Strata saves each start's settings and reuses them for anything not
    # given, so a setting removed from .env would stay in force; deleting the
    # saved preset first makes every start match .env (models are kept).
    entrypoint: ["sh", "-c", "strata launch --delete-preset docker >/dev/null 2>&1 || true; exec /usr/bin/tini -- /opt/strata/entrypoint.sh run"]
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      - API_KEY=${LLM_PASS:-}
      - FAMILY=${STRATA_FAMILY:-qwen}
      - MODEL=${STRATA_MODEL:-IQ3_XXS}
      # GGUF files you already have, inside the container (the strata_models
      # volume below is mounted at /models); empty = download into strata_data
      - MODEL_PATH=${STRATA_MODEL_PATH:-}
      # Per slot, unlike llama.cpp's LLAMA_ARG_CTX_SIZE
      - CONTEXT=${STRATA_CONTEXT:-32k}
      - PARALLEL=${STRATA_PARALLEL:-2}
      - VISION=${STRATA_VISION:-on}
      - KV=${STRATA_KV:-int8}
      - STRATA_SET=${STRATA_SET:-}
    volumes:
      # Must be on an SSD; on Docker Desktop keep it a named volume, not a
      # Windows bind mount
      - strata_data:/data
      - strata_models:/models:ro
    # Pins the experts in RAM; needs unlimited locked memory and room to stop
    ulimits:
      memlock: -1
    shm_size: 2g
    stop_grace_period: 2m
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  core:
    build: ./core
    volumes:
      - ./core:/app
      # Docker socket: the run_code_sandbox tool runs each task in a throwaway
      # container on the local daemon (agents.sandbox DockerSandboxClient).
      # To disable the sandbox: SANDBOX_ENABLED=0 in .env (the mount can stay).
      - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    environment:
      # Voice calls (VOICE_ENABLED=1 in .env turns them on): the sidecar and
      # speech services below, on the compose network.
      - VOICE_BRIDGE_URL=${VOICE_BRIDGE_URL:-ws://voice:8765}
      - SPEECH_URL=${SPEECH_URL:-http://speech:8000}
    depends_on:
      redis:
        condition: service_started
      # Only the engine whose profile is on exists; required: false lets
      # core start with either one.
      llamacpp:
        condition: service_started
        required: false
      strata:
        condition: service_started
        required: false
      voice:
        condition: service_started
      
  diffusion:
    # Image generation (text -> image); see diffusionservice/. Queued (one
    # image at a time), minimal VRAM (sd-turbo + CPU offload by default).
    # Needs a GPU; comment this service out (and set IMAGE_GEN_ENABLED=0 in
    # .env) to run the bot without it.
    build: ./diffusionservice
    volumes:
      - ./diffusionservice:/app
      - diffusers_data:/models
    ports:
      - "8000:8000"
    environment:
      # Model cache on a volume so the download survives redeploys
      - HF_HOME=/models
      # Smallest practical SD model; override in .env to try something else
      - IMAGE_MODEL=${IMAGE_MODEL:-stabilityai/sd-turbo}
      # sd-turbo: 1-4 steps; lower = faster, slightly worse quality
      - IMAGE_STEPS=${IMAGE_STEPS:-4}
      - IMAGE_WIDTH=${IMAGE_WIDTH:-512}
      - IMAGE_HEIGHT=${IMAGE_HEIGHT:-512}
      # CFG scale; empty = the pipeline's default, and forced to 0.0 on
      # distilled models like the sd-turbo default (see generation_params.py)
      - IMAGE_GUIDANCE=${IMAGE_GUIDANCE:-}
      # Baseline negative prompt, merged behind the per-request one. Same
      # default as the chart; dropped automatically on distilled models, which
      # includes the sd-turbo default above.
      - IMAGE_NEGATIVE_PROMPT=${IMAGE_NEGATIVE_PROMPT:-blurry, lowres, jpeg artifacts, extra limbs, extra fingers, watermark, signature, cropped, out of frame}
      # 1/0: encode prompts past CLIP's 77-token window rather than truncate
      - IMAGE_LONG_PROMPT=${IMAGE_LONG_PROMPT:-1}
      # model | sequential | none — see diffusionservice/main.py
      - IMAGE_OFFLOAD=${IMAGE_OFFLOAD:-model}
      # none | nf4 (4-bit FLUX.2 klein; ignored for SD/SDXL)
      - IMAGE_QUANTIZE=${IMAGE_QUANTIZE:-none}
      - IMAGE_QUEUE_SIZE=${IMAGE_QUEUE_SIZE:-16}
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 5m
  speech:
    # Speech-to-text + text-to-speech for voice channels (see speechservice/).
    # CPU only; models download into the volume on first boot.
    build: ./speechservice
    volumes:
      - ./speechservice:/app
      - speech_data:/models
    ports:
      - "8002:8000"
    environment:
      - HF_HOME=/models
      - STT_MODEL=${STT_MODEL:-small.en}
      - STT_THREADS=${STT_THREADS:-4}
      - TTS_THREADS=${TTS_THREADS:-4}
      - VOICE_DEFAULT_VOICE=${VOICE_DEFAULT_VOICE:-af_heart}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 2m
  voice:
    # Discord voice I/O for core (see voicesidecar/): joins channels, hears
    # people and plays speech. Core talks to it over a WebSocket on the
    # compose network; no port is published.
    build: ./voicesidecar
    environment:
      - SPEECH_URL=http://speech:8000
      - VOICE_BRIDGE_HOST=0.0.0.0
      # Optional: core (which reads .env) must then send the same token.
      - VOICE_BRIDGE_TOKEN=${VOICE_BRIDGE_TOKEN:-}
      - VOICE_SILENCE_MS=${VOICE_SILENCE_MS:-800}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - speech
volumes:
  data:
  ollama_data:
  diffusers_data:
  speech_data:
  strata_data:
  # An existing volume of GGUF files, by name (STRATA_MODELS_VOLUME); created
  # empty if there is none
  strata_models:
    name: ${STRATA_MODELS_VOLUME:-strata-models}