version: 2
updates:
  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # First matching group wins. openai-agents pins a narrow openai range, so
    # the two can only be bumped together (each alone failed resolution on
    # #85/#89, 2026-09-18); this group has no update-types filter so a major
    # of either still travels with the other. Everything else lands as one
    # minor/patch batch; other majors stay as individual PRs for review.
    groups:
      openai:
        patterns:
          - openai
          - openai-agents
      core-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /diffusionservice
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # The HF stack must move together: diffusers 0.38 + transformers 5 skewed
    # apart and crashed the single-file (Juggernaut-XL) pipeline in prod
    # (v2.31-v2.37, 2026-09-16). One grouped PR keeps them in lockstep.
    groups:
      huggingface:
        patterns:
          - diffusers
          - transformers
          - compel
          - accelerate
          - huggingface-hub
          - safetensors

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /diffusionservice
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
