version: 2
updates:
  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # First matching group wins. openai-agents pins a narrow openai range, so
    # the two can only be bumped together (each alone failed resolution on
    # #85/#89, 2026-09-18); this group has no update-types filter so a major
    # of either still travels with the other. Everything else lands as one
    # minor/patch batch; other majors stay as individual PRs for review.
    groups:
      openai:
        patterns:
          - openai
          - openai-agents
      core-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /diffusionservice
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # The HF stack must move together: diffusers 0.38 + transformers 5 skewed
    # apart and crashed the single-file (Juggernaut-XL) pipeline in prod
    # (v2.31-v2.37, 2026-09-16). One grouped PR keeps them in lockstep.
    groups:
      huggingface:
        patterns:
          - diffusers
          - transformers
          - compel
          - accelerate
          - huggingface-hub
          - safetensors

  - package-ecosystem: pip
    directory: /speechservice
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # One PR for the whole speech stack, majors included: faster-whisper,
    # ctranslate2, kokoro-onnx and onnxruntime pin each other's ranges and
    # numpy, and the image is only built in CI, never run, so a skew would
    # first show up as a pod that cannot load its models.
    groups:
      speech:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /voicesidecar
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # One PR for the voice sidecar, majors included: @discordjs/voice peers
    # prism-media, opusscript and @snazzah/davey (DAVE), and they are only
    # known to work together as a set.
    groups:
      voice:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /diffusionservice
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /speechservice
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # python:3.13 on purpose (kokoro-onnx does not support 3.14 yet): only
    # take a newer Python when the speech requirements say they support it.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /voicesidecar
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
