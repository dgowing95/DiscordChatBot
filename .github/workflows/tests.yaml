name: Run Tests
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run_pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
   
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements-dev.txt
      
      - name: Run tests
        run: pytest

  # The voice sidecar (voicesidecar/) is Node; its tests are node:test.
  run_node_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voicesidecar/package-lock.json
      - name: Install voice sidecar dependencies
        working-directory: voicesidecar
        run: npm ci --ignore-scripts
      - name: Run voice sidecar tests
        working-directory: voicesidecar
        run: npm test
