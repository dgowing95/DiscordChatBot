name: Auto Tag
on:
  push:
    branches:
      - main

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    environment: release-tag
    permissions:
      contents: read
    steps:
      # Tags are created with TAG_PUSH_TOKEN, not GITHUB_TOKEN, for two reasons:
      # the "Restrict Tagging" ruleset blocks ref creation for everyone but
      # repo admins (GITHUB_TOKEN acts as the GitHub Actions app, which is not
      # one), and a ref pushed with GITHUB_TOKEN does not fire `on: push`, so
      # release.yaml would never start. The environment-scoped secret is a
      # fine-grained PAT with Contents: read and write on this repo. See the
      # Releasing section of AGENTS.md for replacement instructions.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Two steps: the tag is worked out (repository code) with no token in
      # reach, and only the step that creates it gets the PAT.
      - name: Compute next tag
        id: next
        run: |
          set -euo pipefail

          if git tag --points-at HEAD | grep '^v' > /dev/null; then
            echo "HEAD is already tagged ($(git tag --points-at HEAD | tr '\n' ' ')) - skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest=$(git tag -l 'v*' --sort=-v:refname | sed -n '1p')
          echo "Latest tag: ${latest:-none}"
          # The rule (minor bump, or v<major>.0 from .github/release-major)
          # lives in a script so a test can run it (release_tag_tests.py).
          next=$(bash .github/scripts/next_tag.sh "$latest" .github/release-major)
          if [[ ! "$next" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to create malformed tag: $next" >&2
            exit 1
          fi
          echo "Next tag: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create the tag
        if: steps.next.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.TAG_PUSH_TOKEN }}
          NEXT_TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          # Creating the ref with the PAT fires the tag push event that starts
          # release.yaml. The PAT never enters git's credential store.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$NEXT_TAG" \
            -f sha="$GITHUB_SHA"
