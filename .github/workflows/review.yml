name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]    

jobs:
  code_review:
    # Drafts are the batching area: review once the author marks the PR ready, then review
    # only subsequent fix ranges. This avoids spending a full review on every work-in-progress
    # push while preserving a full pass for opened/ready/reopened PRs.
    #
    # Dependabot's PRs are skipped: their check is the end-to-end run (e2e.yaml), its runs
    # cannot see OPENCODE_API_KEY anyway, and a review thread left open would hold up
    # auto-merge ("Protect main" requires every thread resolved).
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [ ubuntu-latest ]
    timeout-minutes: 45
    env:
      # The npm launcher self-updates in the background and can remove ocr during this job.
      OCR_NO_UPDATE: '1'
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      # A cancelled review records no checkpoint, so the run that replaced it reviewed the whole
      # PR again. Letting it finish means the next push reviews only <checkpoint>..<new head>;
      # GitHub keeps at most one run waiting, so a burst of pushes still ends in one catch-up.
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@375f64cd6f67a48a135da83cfcf59c52669a09cb # v1.13.3
        with:
          llm_url: https://opencode.ai/zen/go/v1/chat/completions
          llm_auth_token: ${{ secrets.OPENCODE_API_KEY }}
          llm_model: deepseek-v4.1-flash
          llm_use_anthropic: 'false'
          # Large reviews have hit the default 300-second request deadline before response headers.
          llm_timeout: '600'
          review_concurrency: '2'
          # Pin the installed CLI as well as the action commit. The action otherwise installs
          # `latest`, which can change review behaviour without a repository diff.
          # Dependabot bumps the action commit above but never this string: keep the two in step.
          ocr_version: 1.13.3
          # The action's default extra_body is {"thinking": {"type": "disabled"}}.
          # Some of the upstreams OpenCode Go balances models across
          # reject that field with a 400 (seen with glm-5.3-flash: unknown field / Z.ai 1210).
          llm_extra_body: '{}'
          # OpenCode Go requires a stable per-conversation session id for
          # routing/prompt caching; without it every request 400s with
          # MissingSessionID. https://opencode.ai/docs/go/#where-can-i-use-it
          # Repository-qualified so PR numbers can't collide across repos
          # sharing this self-hosted runner.
          llm_extra_headers: x-opencode-session=${{ github.repository }}-pr-${{ github.event.pull_request.number }}
          # Minutes (1-120), validated by the action's own input check; the default is 15.
          review_task_timeout: 40
          # The same effort for every event: effort is part of the checkpoint fingerprint, so
          # 'medium' on open and 'low' on push made the first push after opening a full review.
          # Checkpoint runs cover only the new commits, so 'medium' costs little there.
          effort: medium
          sticky_summary: 'true'
          checkpoint_range: 'true'
          incremental: 'true'
          # Logs which of the bot's outdated threads it would resolve, and changes nothing.
          # Switch to 'true' once those look right; that needs `contents: write` above, since
          # GitHub gates resolving a thread on repository write access.
          resolve_outdated: report
          # Low-severity findings remain visible in the sticky summary without creating a thread
          # that agents feel obliged to fix. Style and documentation are likewise advisory.
          route_severity_below: low
          route_categories: style,documentation
          # The PR body carries scope, invariants, non-goals, and verification; the title alone
          # did not give the reviewer enough information to distinguish defects from intent.
          background: >-
            PR title: ${{ github.event.pull_request.title }}

            PR description: ${{ github.event.pull_request.body }}
