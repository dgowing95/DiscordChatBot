name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

env:
  VERSION: ${{ github.ref_name }}

jobs:
  validate_release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and commit
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR; got: $VERSION" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not reachable from main." >&2
            exit 1
          fi

  run_tests:
    needs: validate_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements-dev.txt
      - name: Run tests
        run: pytest

  build_images:
    needs: run_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Core docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/dgowing95/discordchatbot:core-${{ env.VERSION }},ghcr.io/dgowing95/discordchatbot:core-latest
          context: ./core
          cache-from: type=registry,ref=ghcr.io/dgowing95/discordchatbot:core-buildcache
          cache-to: type=registry,ref=ghcr.io/dgowing95/discordchatbot:core-buildcache,mode=max

  build_diffusion_image:
    needs: run_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Diffusion docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/dgowing95/discordchatbot:diffusion-${{ env.VERSION }},ghcr.io/dgowing95/discordchatbot:diffusion-latest
          context: ./diffusionservice
          cache-from: type=registry,ref=ghcr.io/dgowing95/discordchatbot:diffusion-buildcache
          cache-to: type=registry,ref=ghcr.io/dgowing95/discordchatbot:diffusion-buildcache,mode=max

  build_chart:
    needs:
      - build_images
      - build_diffusion_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.0
      - name: Package Helm Chart
        run: helm package charts/dis-ai-bot --version "$VERSION" --app-version "$VERSION"
      - name: Push Helm Chart to GHCR
        env:
          HELM_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$HELM_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dchatbot-$VERSION.tgz" oci://ghcr.io/dgowing95/charts
      - uses: actions/upload-artifact@v7
        with:
          name: helm-dis-ai-bot-${{ env.VERSION }}
          path: dchatbot-${{ env.VERSION }}.tgz

  create_release:
    needs: build_chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: helm-dis-ai-bot-${{ env.VERSION }}
      - name: Create Release
        run: |
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes
          gh release upload "$VERSION" "dchatbot-$VERSION.tgz"
