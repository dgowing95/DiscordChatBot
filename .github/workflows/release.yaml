name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  run_tests:
    runs-on: ubuntu-latest
    # Releases are cut by auto-tag.yaml straight off a push to main, so this is
    # the only place the shipped commit is actually tested before it becomes an
    # image and a chart.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements-dev.txt
      - name: Run tests
        run: pytest

  build_images:
    needs: run_tests
    runs-on: ubuntu-latest
    # workflow_dispatch is how auto-tag.yaml triggers this; guard against
    # someone dispatching it on a branch, which would tag/release "main".
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Core docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/dgowing95/discordchatbot:core-${{github.ref_name}},ghcr.io/dgowing95/discordchatbot:core-latest
          context: ./core
          cache-from: type=registry,ref=ghcr.io/dgowing95/discordchatbot:core-buildcache
          cache-to: type=registry,ref=ghcr.io/dgowing95/discordchatbot:core-buildcache,mode=max

  build_diffusion_image:
    needs: run_tests
    runs-on: ubuntu-latest
    # workflow_dispatch is how auto-tag.yaml triggers this; guard against
    # someone dispatching it on a branch, which would tag/release "main".
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Diffusion docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/dgowing95/discordchatbot:diffusion-${{github.ref_name}},ghcr.io/dgowing95/discordchatbot:diffusion-latest
          context: ./diffusionservice
          cache-from: type=registry,ref=ghcr.io/dgowing95/discordchatbot:diffusion-buildcache
          cache-to: type=registry,ref=ghcr.io/dgowing95/discordchatbot:diffusion-buildcache,mode=max

  build_chart:
    needs:
      - build_images
      - build_diffusion_image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v4.3.0
      - name: Package Helm Chart
        run: |
          helm package charts/dis-ai-bot --version ${{ github.ref_name }} --app-version ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: helm-dis-ai-bot-${{ github.ref_name }}
          path: dchatbot-${{ github.ref_name }}.tgz      

  create_release:
    needs: build_chart
    runs-on: ubuntu-latest
    permissions:
      contents: write    
    env:
      GH_TOKEN: ${{ github.token }}      
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: helm-dis-ai-bot-${{ github.ref_name }}
      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --generate-notes

          gh release upload ${{ github.ref_name }} dchatbot-${{ github.ref_name }}.tgz