name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

env:
  VERSION: ${{ github.ref_name }}

jobs:
  validate_release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    outputs:
      whats_new_changed: ${{ steps.whats_new.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and commit
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR; got: $VERSION" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not reachable from main." >&2
            exit 1
          fi
      # core/whats_new.md is one fixed file that feature PRs rewrite, so a
      # release without features still carries the previous release's notes.
      # Only a file that changed since the previous tag belongs to this
      # release; otherwise it is blanked in the image and left off the
      # GitHub release (see core/classes/whats_new.py).
      - name: Did this release change the What's New notes?
        id: whats_new
        run: |
          set -euo pipefail
          # Fails closed: a git error must stop the release, not read as
          # "changed" and silently re-ship the previous release's notes.
          if prev=$(git describe --tags --abbrev=0 --match 'v*' "${VERSION}^" 2>/dev/null); then
            set +e
            git diff --quiet "$prev" "$VERSION" -- core/whats_new.md
            diff_status=$?
            set -e
            if [ "$diff_status" -eq 0 ]; then
              changed=false
            elif [ "$diff_status" -eq 1 ]; then
              changed=true
            else
              echo "git diff failed (exit $diff_status) comparing $prev..$VERSION" >&2
              exit 1
            fi
          elif [ -z "$(git tag -l 'v*' | grep -vxF "$VERSION" || true)" ]; then
            # The very first release: there is nothing earlier to diff against.
            prev=""
            changed=true
          else
            echo "No earlier v* tag found before $VERSION although v* tags exist" >&2
            exit 1
          fi
          echo "Previous tag: ${prev:-none}; whats_new.md changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  run_tests:
    needs: validate_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: 3.13
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements-dev.txt
      - name: Run tests
        run: pytest

  build_images:
    needs: [validate_release, run_tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Blank unchanged What's New notes
        if: needs.validate_release.outputs.whats_new_changed != 'true'
        run: ': > core/whats_new.md'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Core docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          build-args: APP_VERSION=${{ env.VERSION }}
          tags: ghcr.io/dgowing95/discordchatbot:core-${{ env.VERSION }},ghcr.io/dgowing95/discordchatbot:core-latest
          context: ./core
          cache-from: type=registry,ref=ghcr.io/dgowing95/discordchatbot:core-buildcache
          cache-to: type=registry,ref=ghcr.io/dgowing95/discordchatbot:core-buildcache,mode=max

  build_diffusion_image:
    needs: run_tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push Diffusion docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/dgowing95/discordchatbot:diffusion-${{ env.VERSION }},ghcr.io/dgowing95/discordchatbot:diffusion-latest
          context: ./diffusionservice
          cache-from: type=registry,ref=ghcr.io/dgowing95/discordchatbot:diffusion-buildcache
          cache-to: type=registry,ref=ghcr.io/dgowing95/discordchatbot:diffusion-buildcache,mode=max

  build_chart:
    needs:
      - build_images
      - build_diffusion_image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@v5.0.1
      - name: Package Helm Chart
        run: helm package charts/dis-ai-bot --version "$VERSION" --app-version "$VERSION"
      - name: Push Helm Chart to GHCR
        env:
          HELM_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$HELM_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "dchatbot-$VERSION.tgz" oci://ghcr.io/dgowing95/charts
      - uses: actions/upload-artifact@v7
        with:
          name: helm-dis-ai-bot-${{ env.VERSION }}
          path: dchatbot-${{ env.VERSION }}.tgz

  create_release:
    needs: [validate_release, build_chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: helm-dis-ai-bot-${{ env.VERSION }}
      - name: Create Release
        env:
          WHATS_NEW_CHANGED: ${{ needs.validate_release.outputs.whats_new_changed }}
        run: |
          set -euo pipefail
          notes_args=()
          if [ "$WHATS_NEW_CHANGED" = "true" ]; then
            # Drop the authoring comment and nest the headings; gh puts the
            # generated notes after this text.
            { echo "## What's new"; echo; perl -0pe 's/<!--.*?-->//gs' core/whats_new.md \
                | sed 's/^## /### /'; } > whats_new_release.md
            notes_args=(--notes-file whats_new_release.md)
          fi
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --generate-notes "${notes_args[@]}"
          gh release upload "$VERSION" "dchatbot-$VERSION.tgz"
