name: Verify Artifacts
on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  verify_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          tags: core-test
          context: ./core
          cache-from: type=registry,ref=ghcr.io/dgowing95/discordchatbot:core-buildcache

  verify_diffusion_image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Diffusion Docker Image
        uses: docker/build-push-action@v6
        with:
          tags: diffusion-test
          context: ./diffusionservice
          cache-from: type=registry,ref=ghcr.io/dgowing95/discordchatbot:diffusion-buildcache

  verify_chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.0
      - name: Lint Helm Chart
        run: |
          helm lint charts/dis-ai-bot
