name: End-to-end
# Starts the PR's bot for real and talks to it through Discord (see e2e/ and
# "End-to-end CI" in AGENTS.md). This is what makes a dependency bump safe to
# merge without trying it by hand.
on:
  pull_request:
    branches:
      - main
  # Warms the dependency/model caches that PR runs restore (a PR can read
  # main's caches, not another PR's) whenever the inputs to them change.
  push:
    branches:
      - main
    paths:
      - core/requirements.txt
      - speechservice/requirements.txt
      - diffusionservice/requirements.txt
      - voicesidecar/package-lock.json
      - e2e/**
  workflow_dispatch:
    inputs:
      diffusion:
        description: Also run this branch's image service (on CPU, tiny model)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Decided per job rather than with on.pull_request.paths: a workflow that
  # never starts reports no status, and `e2e` is a required check. Require
  # this job too: if it FAILS, `e2e` is skipped, and a skipped job counts as
  # passing a required check.
  e2e-changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
      diffusion: ${{ steps.diff.outputs.diffusion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_DIFFUSION: ${{ inputs.diffusion }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "diffusion=${FORCE_DIFFUSION:-false}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE" ] || [ -z "${BASE//0/}" ]; then
            # No usable base (a branch's first push): run everything.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "diffusion=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          printf '%s\n' "$changed"
          run=false; diffusion=false
          if grep -qE '^(core|speechservice|voicesidecar|diffusionservice|e2e)/|^\.github/workflows/e2e\.yaml$' <<< "$changed"; then
            run=true
          fi
          if grep -q '^diffusionservice/' <<< "$changed"; then
            diffusion=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "diffusion=$diffusion" >> "$GITHUB_OUTPUT"

  e2e:
    needs: e2e-changes
    # Forks are skipped: they have no secrets, and the self-hosted runner is
    # for this repository's own branches. This `if` is a convenience, not the
    # security boundary -- a fork can edit it -- which is why fork PRs need a
    # maintainer's approval before any workflow runs.
    if: >-
      needs.e2e-changes.outputs.run == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    # Self-hosted: it needs a real LLM and image service, provided through
    # the runner's E2E_LLM_HOST / E2E_DIFFUSION_URL / E2E_MODEL environment.
    # The runner must be unprivileged: this job runs the PR's dependencies.
    runs-on: discordchatbot-e2e
    timeout-minutes: 45
    env:
      E2E_DISCORD_TOKEN: ${{ secrets.E2E_DISCORD_TOKEN }}
      E2E_WEBHOOK_URL: ${{ secrets.E2E_WEBHOOK_URL }}
      E2E_VOICE_CHANNEL_ID: ${{ secrets.E2E_VOICE_CHANNEL_ID }}
      E2E_LOCAL_DIFFUSION: ${{ needs.e2e-changes.outputs.diffusion == 'true' && '1' || '0' }}
      E2E_RUN_NAME: ${{ github.event.pull_request.number && format('PR {0}', github.event.pull_request.number) || github.ref_name }} run ${{ github.run_id }}
    steps:
      - name: Check configuration
        run: |
          set -euo pipefail
          missing=()
          for var in E2E_DISCORD_TOKEN E2E_WEBHOOK_URL E2E_LLM_HOST E2E_MODEL; do
            [ -n "${!var:-}" ] || missing+=("$var")
          done
          if [ "$E2E_LOCAL_DIFFUSION" != 1 ] && [ -z "${E2E_DIFFUSION_URL:-}" ]; then
            missing+=(E2E_DIFFUSION_URL)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            # Secrets for Dependabot's PRs live in the separate Dependabot
            # secrets store; the runner settings come from the runner itself.
            echo "Not configured: ${missing[*]}" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Each service is tested on the Python/Node its image uses, read from
      # its Dockerfile, so a base-image bump changes what is tested too.
      - name: Read runtime versions
        id: versions
        run: |
          set -euo pipefail
          from() { grep -m1 -oE "^FROM $1:[0-9]+(\.[0-9]+)?" "$2" | cut -d: -f2; }
          echo "core=$(from python core/Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "speech=$(from python speechservice/Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "diffusion=$(from python diffusionservice/Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "node=$(from node voicesidecar/Dockerfile)" >> "$GITHUB_OUTPUT"

      - id: core_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.core }}
      - id: speech_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.speech }}
      - id: diffusion_python
        if: env.E2E_LOCAL_DIFFUSION == '1'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.versions.outputs.diffusion }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Restore caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.cache/e2e
          key: e2e-${{ runner.os }}-${{ hashFiles('core/requirements.txt', 'speechservice/requirements.txt', 'diffusionservice/requirements.txt', 'voicesidecar/package-lock.json', 'e2e/start_stack.sh') }}
          restore-keys: e2e-${{ runner.os }}-

      - name: Start the bot and its services
        env:
          CORE_PYTHON: ${{ steps.core_python.outputs.python-path }}
          SPEECH_PYTHON: ${{ steps.speech_python.outputs.python-path }}
          DIFFUSION_PYTHON: ${{ steps.diffusion_python.outputs.python-path }}
        run: e2e/start_stack.sh

      - name: Talk to the bot through Discord
        run: .e2e/core/bin/python e2e/run_checks.py

      - name: Stop the services
        if: always()
        run: e2e/stop_stack.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: e2e/logs/
          retention-days: 7
          if-no-files-found: ignore
