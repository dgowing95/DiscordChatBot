name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Do not include secrets or security-sensitive details.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: List the smallest set of steps that reproduces the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, chart version, or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment method
      options:
        - Kubernetes / Helm
        - Docker Compose
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, webhook URLs, private prompts, and personal data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and private data from this report.
          required: true
        - label: This is not a security vulnerability; I will report those privately.
          required: true
