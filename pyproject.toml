# Pytest configuration. Before this existed, the suite could only be run by
# naming all 13 files explicitly (bare `pytest` matched none of them, because
# they are *_tests.py rather than the default test_*.py), which meant the CI
# workflow carried a hand-maintained file list and AGENTS.md had to tell
# contributors to update it.
[tool.pytest.ini_options]
python_files = ["*_tests.py"]
testpaths = ["core/tests"]
# `core` ONLY, deliberately not `.` as well. The app runs with cwd=core/ and
# imports its siblings as `classes.X`. The suite used to import the same
# modules as `core.classes.X`, and the two resolve to SEPARATE module objects
# with separate globals -- so a patch applied to one copy left the other
# unpatched, and metrics.py/message_queue.py each needed a sys.modules
# aliasing hack to stop their import-time state being registered twice.
# Everything now uses the `classes.X` name only.
#
# What pytest puts on sys.path itself is the BASEDIR of each collected file
# (core/tests, since it has no __init__.py) -- not the rootdir. So `core.X`
# resolves only when the repo root reaches sys.path some other way, e.g. via
# the cwd that `python -m pytest` prepends; under CI's bare `pytest` it is an
# ImportError. Nothing may use that name anyway (a namespace-package `core.X`
# is a SECOND module object with its own globals), and sibling test helpers
# are imported by bare module name -- `from response_filter_tests import ...`.
# `grep -rn "core\.classes\|core\.tests" core/` should stay empty.
pythonpath = ["core"]
